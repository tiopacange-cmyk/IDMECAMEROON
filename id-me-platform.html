<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Me Cameroon — Plateforme de suivi des dossiers</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>
/* Design system IDME Cameroun — espace agent (design-system/idme-cameroun/pages/espace-agent.md) */
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600;700&display=swap');

:root{
  --ink:#333333;          /* texte, 12,6:1 sur blanc */
  --ink-soft:#5B6560;     /* texte secondaire, 5,5:1 sur le fond */
  --paper:#F5F5F5;        /* fond de page */
  --paper-raised:#FFFFFF; /* cartes, tableaux */
  --green:#006B3F;        /* primaire (vert national) */
  --green-deep:#0B3D26;   /* titres */
  --brand-dark:#0B3D26;   /* barre latérale, bandeaux sombres */
  --gold:#92400E;         /* or pour le texte, 7,1:1 sur blanc */
  --gold-solid:#92400E;   /* or en fond, texte blanc */
  --red:#B91C1C;          /* rejeté / erreur (texte) */
  --red-solid:#B91C1C;    /* rouge en fond, texte blanc */
  --ok:#15803D;           /* validé (texte) */
  --ok-solid:#15803D;     /* vert en fond, texte blanc */
  --info:#0369A1;         /* en instruction */
  --line:#D9DDDB;         /* bordures */
  --line-soft:#ECEEED;    /* séparateurs légers */
  --field:#8A968F;        /* bordure des champs, 3,1:1 */
  --focus:#0369A1;        /* contour de focus */
  --ok-bg:#ECF7EF; --info-bg:#EFF6FB; --red-bg:#FDF0F0; --warn-bg:#FBF3E8; --warn-line:#E9C98A;
  --purple:#6B21A8; --purple-bg:#F3E8FF; --row-hover:#F0F5F2; --red-line:#F1C4C4; --ok-line:#B9DCC4;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Fira Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size:15px;
  line-height:1.5;
}
h1,h2,h3{
  font-family:'Fira Sans', system-ui, sans-serif;
  font-weight:700;
  margin:0;
  color:var(--green-deep);
}
.app{ display:flex; min-height:100vh; }

/* --- Sidebar --- */
.sidebar{
  width:220px; flex-shrink:0;
  background:var(--brand-dark);
  color:#EFEAE0;
  padding:24px 0;
  display:flex; flex-direction:column;
}
.brand{ padding:0 20px 20px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:16px; }
.brand .mark{ font-family:'Fira Sans',system-ui,sans-serif; font-weight:700; font-size:20px; font-weight:600; color:#fff; }
.brand .sub{ font-size:11px; color:#B8C4BC; margin-top:4px; letter-spacing:.02em; }
nav{ display:flex; flex-direction:column; gap:2px; padding:0 12px; }
nav button{
  all:unset; cursor:pointer;
  padding:10px 12px; border-radius:6px;
  font-size:14px; color:#D8DED9;
  display:flex; align-items:center; gap:10px;
}
nav button:hover{ background:rgba(255,255,255,0.06); }
nav button.active{ background:var(--green); color:#fff; }
.sidebar-foot{ margin-top:auto; padding:16px 20px 4px; font-size:11px; color:#B8C4BC; border-top:1px solid rgba(255,255,255,0.1); }

/* --- Main --- */
main{ flex:1; padding:32px 40px; max-width:1100px; }
.page-head{ margin-bottom:24px; }
.page-head h1{ font-size:26px; }
.page-head p{ color:var(--ink-soft); margin-top:4px; font-size:14px; }

/* --- Form --- */
.wizard-head{ margin-bottom:22px; }
.wizard-title{ font-family:'Fira Sans',system-ui,sans-serif; font-weight:700; font-size:19px; color:var(--green-deep); margin-bottom:10px; }
.wizard-progress{ background:var(--line-soft); border-radius:3px; height:6px; overflow:hidden; margin-bottom:14px; }
.wizard-progress-fill{ background:var(--green); height:100%; transition:width .2s ease; }
.wizard-dots{ display:flex; gap:10px; overflow-x:auto; padding-bottom:2px; }
.wdot{
  all:unset; cursor:pointer; flex-shrink:0;
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-weight:600;
  background:var(--paper-raised); border:1.5px solid var(--line); color:var(--ink-soft);
}
.wdot.done{ background:var(--green); border-color:var(--green); color:#fff; }
.wdot.active{ border-color:var(--gold); color:var(--green-deep); box-shadow:0 0 0 3px rgba(184,134,47,0.18); }
.wizard-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; gap:10px; }

.section-block{ margin-bottom:28px; }
.section-block h3{
  font-size:13px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--gold); font-family:'Fira Sans',system-ui,sans-serif; font-weight:700;
  border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:14px;
}
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px 20px; }
.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:13.5px; color:var(--ink-soft); }
.field input, .field select, .field textarea{
  font-family:inherit; font-size:16px; padding:10px 11px;
  border:1px solid var(--field); border-radius:6px; background:var(--paper-raised);
  color:var(--ink); min-height:44px;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(0,107,63,0.25);
}
.radio-row{ display:flex; gap:18px; flex-wrap:wrap; align-items:center; padding-top:6px; }
.radio-row label{ display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink); }

.btn{
  font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
  border:none; border-radius:6px; padding:11px 20px;
  min-height:44px; transition:background-color .2s ease;
}
.btn-primary{ background:var(--green); color:#fff; }
.btn-primary:hover{ background:#005532; }
.btn-ghost{ background:transparent; color:var(--green-deep); border:1px solid var(--field); }
.btn-ghost:hover{ background:var(--line-soft); }

.alert{
  border-radius:6px; padding:12px 16px; font-size:13.5px; margin-bottom:18px;
  display:flex; gap:10px; align-items:flex-start;
}
.alert-warn{ background:var(--warn-bg); border:1px solid var(--warn-line); color:var(--gold); }
.alert-ok{ background:var(--ok-bg); border:1px solid var(--ok-line); color:var(--green-deep); }

/* --- Table --- */
.toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.toolbar input{ flex:1; min-width:220px; }
.toolbar input, .toolbar select{
  font-family:inherit; font-size:14px; padding:9px 10px;
  border:1px solid var(--field); border-radius:6px; background:var(--paper-raised); color:var(--ink);
  min-height:44px;
}
.toolbar select{ min-width:150px; }
table{ width:100%; border-collapse:collapse; background:var(--paper-raised); border:1px solid var(--line); }
th{
  text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--ink-soft); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line);
}
td{ padding:11px 12px; font-size:13.5px; border-bottom:1px solid var(--line-soft); vertical-align:top; font-variant-numeric:tabular-nums; }
tr:last-child td{ border-bottom:none; }
tr.row-clickable{ cursor:pointer; }
tr.row-clickable:hover{ background:var(--row-hover); }
.badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:600; white-space:nowrap; }
.badge-new{ background:var(--info-bg); color:var(--info); }
.badge-mairie{ background:var(--warn-bg); color:var(--gold); }
.badge-tpi{ background:var(--purple-bg); color:var(--purple); }
.badge-done{ background:var(--ok-bg); color:var(--ok); }
.badge-blocked{ background:var(--red-bg); color:var(--red); }
.empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }

/* --- Dashboard --- */
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:28px; }
.stat{ background:var(--paper-raised); padding:16px; }
.stat .n{ font-family:'Fira Sans',system-ui,sans-serif; font-weight:700; font-size:28px; color:var(--green-deep); font-variant-numeric:tabular-nums; line-height:1.2; }
.stat .l{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
.stat.accent-green{ border-left:4px solid var(--ok); }
.stat.accent-green .n{ color:var(--ok); }
.stat.accent-gold{ border-left:4px solid var(--gold); }
.stat.accent-gold .n{ color:var(--gold); }
.stat.accent-red{ border-left:4px solid var(--red); }
.stat.accent-red .n{ color:var(--red); }
.stat.accent-purple{ border-left:4px solid #5B3B7A; }
.stat.accent-purple .n{ color:#5B3B7A; }
.dash-group-title{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin:0 0 10px; }
.subhead{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin:0 0 12px; }
.bar-row{ display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13px; }
.bar-row .lab{ width:150px; flex-shrink:0; color:var(--ink-soft); }
.bar-track{ flex:1; background:var(--line-soft); border-radius:3px; height:8px; overflow:hidden; }
.bar-fill{ background:var(--green); height:100%; }
.bar-row .val{ width:28px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }

.modal-back{ position:fixed; inset:0; background:rgba(11,61,38,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
.modal{ background:var(--paper-raised); border-radius:8px; padding:26px; max-width:720px; width:100%; max-height:88vh; overflow:auto; }
.modal h2{ font-size:19px; margin-bottom:14px; }
.detail-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; gap:16px; }
.detail-row .k{ color:var(--ink-soft); }
.detail-row .v{ text-align:right; font-weight:500; }
.modal-actions{ display:flex; gap:10px; margin-top:18px; justify-content:flex-end; }

@media (max-width:760px){
  .app{ flex-direction:column; }
  .sidebar{ width:100%; flex-direction:row; padding:14px 16px; align-items:center; }
  .brand{ border:none; padding:0; margin:0; }
  .brand .sub{ display:none; }
  nav{ flex-direction:row; padding:0; margin-left:auto; }
  .sidebar-foot{ display:none; }
  main{ padding:20px 16px; }
  .lab{ width:100px !important; }
}

.receipt-print{ display:none; }
@media print{
  #login-root, #app-root, #modal-root{ display:none !important; }
  .receipt-print{ display:block !important; position:static; width:100%; padding:22px; }
  .receipt-print h2{ font-size:20px; }
  .receipt-print table{ width:100%; border-collapse:collapse; margin-top:24px; }
  .receipt-print td{ padding:10px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .receipt-print td:first-child{ color:var(--ink-soft); width:45%; }
}

/* --- Login --- */
.login-screen{
  min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
  background:var(--brand-dark); padding:20px; margin:0 auto;
}
.login-card{
  background:var(--paper-raised); border-radius:10px; padding:36px 32px;
  max-width:380px; width:100%;
}
.login-mark{ font-family:'Fira Sans',system-ui,sans-serif; font-weight:700; font-size:24px; color:var(--green-deep); margin-bottom:2px; }
.login-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:28px; }
.login-error{
  background:var(--red-bg); color:var(--red); border:1px solid var(--red-line);
  border-radius:6px; padding:10px 12px; font-size:13px; margin-bottom:16px;
}
.login-hint{ margin-top:20px; font-size:12px; color:var(--ink-soft); border-top:1px solid var(--line-soft); padding-top:14px; line-height:1.6; }

/* --- Design system IDME : accessibilité et harmonisation (CSS uniquement) --- */
/* Or lisible sur la barre latérale sombre */
.sidebar .sub{ color:#E8C35A !important; }
/* Contour de focus visible au clavier (les boutons « all:unset » n'en avaient plus) */
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.sidebar :focus-visible, .login-screen button:focus-visible{ outline-color:#E8C35A; }
nav button{ min-height:44px; box-sizing:border-box; transition:background-color .2s ease; }
.wdot{ width:44px; height:44px; }
.wdot.active{ border-color:var(--green); box-shadow:0 0 0 3px rgba(0,107,63,0.2); }
/* Icônes SVG et numéros de dossier */
.ic{ width:1.15em; height:1.15em; vertical-align:-0.2em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.mono{ font-family:'Fira Code', ui-monospace, monospace; font-size:13px; letter-spacing:.02em; }
.module-select-btn > div:first-child{ color:var(--green); }
.wdot .ic{ width:18px; height:18px; }
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }

/* --- Mode sombre (activé par le bouton de la barre latérale) --- */
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E8EDE9; --ink-soft:#9AA7A0; --paper:#0E1512; --paper-raised:#18221D;
  --green-deep:#8FD4AE; --gold:#E8C35A; --red:#F0736A; --ok:#3FB27F; --info:#6CB7F0;
  --line:#2C3A33; --line-soft:#223029; --field:#5E6E66; --focus:#6CB7F0;
  --ok-bg:#16301F; --info-bg:#16283A; --red-bg:#3A1E1C; --warn-bg:#352D17; --warn-line:#5C4A1E;
  --purple:#C9A2F0; --purple-bg:#2A1E3A; --row-hover:#1F2B25; --red-line:#5C2A27; --ok-line:#285C3A;
}
:root[data-theme="dark"] .modal-back{ background:rgba(0,0,0,0.6); }
:root[data-theme="dark"] .wdot.done{ color:#fff; }
/* L'impression reste toujours claire */
@media print{
  :root[data-theme="dark"]{
    color-scheme:light;
  --ink:#333333;          /* texte, 12,6:1 sur blanc */
  --ink-soft:#5B6560;     /* texte secondaire, 5,5:1 sur le fond */
  --paper:#F5F5F5;        /* fond de page */
  --paper-raised:#FFFFFF; /* cartes, tableaux */
  --green:#006B3F;        /* primaire (vert national) */
  --green-deep:#0B3D26;   /* titres */
  --brand-dark:#0B3D26;   /* barre latérale, bandeaux sombres */
  --gold:#92400E;         /* or pour le texte, 7,1:1 sur blanc */
  --gold-solid:#92400E;   /* or en fond, texte blanc */
  --red:#B91C1C;          /* rejeté / erreur (texte) */
  --red-solid:#B91C1C;    /* rouge en fond, texte blanc */
  --ok:#15803D;           /* validé (texte) */
  --ok-solid:#15803D;     /* vert en fond, texte blanc */
  --info:#0369A1;         /* en instruction */
  --line:#D9DDDB;         /* bordures */
  --line-soft:#ECEEED;    /* séparateurs légers */
  --field:#8A968F;        /* bordure des champs, 3,1:1 */
  --focus:#0369A1;        /* contour de focus */
  --ok-bg:#ECF7EF; --info-bg:#EFF6FB; --red-bg:#FDF0F0; --warn-bg:#FBF3E8; --warn-line:#E9C98A;
  --purple:#6B21A8; --purple-bg:#F3E8FF; --row-hover:#F0F5F2; --red-line:#F1C4C4; --ok-line:#B9DCC4;
  }
}
</style>
</head>

function compressImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function stepComplete(d, index){
  switch(index){
    case 0: return !!(d.nom && d.prenom);
    case 1: return !!(d.paiement_montant || d.paiement_date);
    case 2: return !!(d.sexe && d.dob);
    case 3: return !!((d.envois||[]).length);
    case 4: return d.decharge_remise === 'Oui';
    default: return false;
  }
}
function progressInfo(d){
  let doneCount = 0;
  let lastComplete = -1;
  for(let i=0; i<STEP_LABELS.length; i++){
    if(stepComplete(d, i)){ doneCount++; lastComplete = i; }
  }
  const closed = stepComplete(d, STEP_LABELS.length-1);
  const currentIndex = closed ? STEP_LABELS.length-1 : Math.min(lastComplete+1, STEP_LABELS.length-1);
  return { doneCount, currentIndex, total: STEP_LABELS.length, closed };
}

function piecesAllFournies(d){
  return (d.pieces||[]).length>0 && (d.pieces||[]).every(p=>p.statut==='Fournie');
}
function hasEnvoiTo(d, dest){
  return (d.envois||[]).some(e=>e.destination===dest);
}
function computeCycleStage(d){
  if(d.type_cas==='Cas TPI'){
    if(!piecesAllFournies(d)) return 0;
    if(!hasEnvoiTo(d,'TPI')) return 1;
    if(!d.tpi_decision) return 2;
    if(d.tpi_decision==='rejete') return 2;
    if(!(d.tpi_docs||[]).length) return 3;
    if(!hasEnvoiTo(d,'Mairie')) return 4;
    if(!(d.mairie_docs||[]).length) return 5;
    return 6;
  }
  if(d.type_cas==='Cas Mairie'){
    if(!piecesAllFournies(d)) return 0;
    if(!hasEnvoiTo(d,'Mairie')) return 0;
    if(!d.mairie_decision) return 0;
    if(d.mairie_decision==='rejete') return 0;
    if(!(d.mairie_docs||[]).length) return 1;
    return 2;
  }
  if(d.type_cas==='Cas BUNEC'){
    if(!hasEnvoiTo(d,'BUNEC')) return 0;
    if(!(d.bunec_docs||[]).length) return 0;
    return 1;
  }
  return d.cycle_stage || 0;
}

   Les mots de passe sont vérifiés par Firebase, jamais par le navigateur.
   Chaque identifiant (ex. « agent1 ») correspond à une adresse technique
   agent1@<authDomain du projet>. Les profils (nom, rôle, compte actif)
   sont dans la collection Firestore « users », sans aucun mot de passe.
   Mise en place : voir SECURITE.md et firestore.rules.
   ============================================================ */
const USERNAME_RE = /^[a-z0-9._-]{3,32}$/;
const MIN_PASSWORD_LENGTH = 8;
let legacyUsers = [];      // anciens comptes (avant Firebase Auth), sans mot de passe, à recréer
let syncUnsubscribers = [];
let authListenerStarted = false;
let needsSetup = false;      // aucun compte Super Admin encore créé : écran « Première installation »
let setupInProgress = false;

function usernameToEmail(username){
  return `${String(username||'').trim().toLowerCase()}@${firebaseConfig.authDomain}`;
}
function canWriteConfig(){ return !!currentUser && currentUser.role !== 'Agent'; }
function stopSync(){ syncUnsubscribers.forEach(fn=>{ try{ fn(); }catch(e){} }); syncUnsubscribers = []; }

async function loadData(){
  renderLogin();
  await initFirebase();
  if(!dbReady){
    dossiers = [];
    formDraft = { id: nextId() };
    if(!currentUser) renderLogin();
    return;
  }
  await checkSetup();
  startAuthListener();
}

// Le document public appdata/setup indique si le premier Super Admin a été créé.
async function checkSetup(){
  try{
    const snap = await db.collection('appdata').doc('setup').get();
    needsSetup = !snap.exists;
  }catch(e){
    needsSetup = false; // en cas de doute, on affiche l'écran de connexion normal
    console.error('Vérification de la première installation impossible', e);
  }
}

function startAuthListener(){
  if(authListenerStarted || !auth) return;
  authListenerStarted = true;
  auth.onAuthStateChanged(fbUser=>{
    if(setupInProgress) return; // la première installation gère elle-même la suite
    handleAuthUser(fbUser);
  });
}

async function handleAuthUser(fbUser){
  if(!fbUser){
    stopSync();
    currentUser = null;
    users = [];
    document.getElementById('app-root').style.display = 'none';
    renderLogin();
    return;
  }
  try{
    const snap = await db.collection('users').doc(fbUser.uid).get();
    if(!snap.exists){
      loginError = `Ce compte n'a pas encore de profil dans la plateforme. Transmettez cet identifiant technique à votre administrateur : ${fbUser.uid}`;
      await auth.signOut();
      return;
    }
    const prof = snap.data();
    if(prof.active === false){
      loginError = "Ce compte est désactivé. Contactez votre administrateur.";
      await auth.signOut();
      return;
    }
    currentUser = { uid: fbUser.uid, username: prof.username, nom: prof.nom, role: prof.role, mustChangePassword: !!prof.mustChangePassword };
    if(currentUser.role === 'Super Admin') markSetupDone();
    await loadAppData();
    enterApp();
  }catch(e){
    console.error('Erreur de chargement du profil', e);
    loginError = "Accès refusé par le service de données. Vérifiez que les règles de sécurité Firestore sont publiées (voir SECURITE.md).";
    await auth.signOut();
  }
}

// Si des comptes ont été créés à la main dans la console, on ferme quand même
// l'écran de première installation dès qu'un Super Admin se connecte.
async function markSetupDone(){
  needsSetup = false;
  try{
    const ref = db.collection('appdata').doc('setup');
    const snap = await ref.get();
    if(!snap.exists) await ref.set({ done:true, by: currentUser.uid, at: new Date().toISOString() });
  }catch(e){ console.error('Impossible de marquer la première installation comme faite', e); }
}

/* --- Première installation : création du premier compte Super Admin --- */
function renderSetup(){
  const root = document.getElementById('login-root');
  root.style.display = 'flex';
  root.innerHTML = `
  <div class="login-screen">
    <div class="login-card" style="max-width:420px;">
      <div class="login-mark" style="text-align:center;">ID Me Cameroon</div>
      <div class="login-sub" style="text-align:center;">Première installation</div>
      <p style="font-size:14px; margin:0 0 16px;">Aucun compte n'existe encore. Créez le compte <strong>Super Admin</strong> : c'est lui qui créera ensuite les comptes des agents. Cet écran disparaît dès que ce compte est créé.</p>
      ${loginError ? `<div class="login-error" role="alert">${loginError}</div>` : ''}
      <div class="field" style="margin-bottom:12px;"><label for="setup-nom">Votre nom complet</label><input id="setup-nom" autocomplete="name"></div>
      <div class="field" style="margin-bottom:12px;"><label for="setup-username">Identifiant de connexion</label><input id="setup-username" autocomplete="username" aria-describedby="setup-username-help"><span id="setup-username-help" style="font-size:12.5px; color:var(--ink-soft);">Ex. « direction ». 3 à 32 caractères : lettres minuscules, chiffres, point, tiret.</span></div>
      <div class="field" style="margin-bottom:12px;"><label for="setup-password">Mot de passe</label><input id="setup-password" type="password" autocomplete="new-password" aria-describedby="setup-password-help"><span id="setup-password-help" style="font-size:12.5px; color:var(--ink-soft);">Au moins ${MIN_PASSWORD_LENGTH} caractères. Notez-le en lieu sûr.</span></div>
      <div class="field" style="margin-bottom:20px;"><label for="setup-confirm">Confirmer le mot de passe</label><input id="setup-confirm" type="password" autocomplete="new-password"></div>
      <button type="button" class="btn btn-primary" id="setup-btn" style="width:100%;">Créer mon compte Super Admin</button>
    </div>
  </div>`;
  const btn = document.getElementById('setup-btn');
  btn.addEventListener('click', async ()=>{
    const nom = document.getElementById('setup-nom').value.trim();
    const username = document.getElementById('setup-username').value.trim().toLowerCase();
    const password = document.getElementById('setup-password').value;
    const confirmPw = document.getElementById('setup-confirm').value;
    const fail = msg=>{ loginError = msg; renderSetup(); };
    if(!nom) return fail('Saisissez votre nom complet.');
    if(!USERNAME_RE.test(username)) return fail("Identifiant invalide : 3 à 32 caractères, lettres minuscules, chiffres, point ou tiret.");
    if(password.length < MIN_PASSWORD_LENGTH) return fail(`Le mot de passe doit contenir au moins ${MIN_PASSWORD_LENGTH} caractères.`);
    if(password !== confirmPw) return fail('Les deux mots de passe ne sont pas identiques.');
    btn.disabled = true;
    setupInProgress = true;
    let cred;
    try{
      cred = await auth.createUserWithEmailAndPassword(usernameToEmail(username), password);
    }catch(e){
      setupInProgress = false;
      return fail(e.code==='auth/operation-not-allowed'
        ? "La connexion par mot de passe n'est pas encore activée dans Firebase (Authentication > Sign-in method > E-mail/Mot de passe)."
        : e.code==='auth/email-already-in-use' ? 'Cet identifiant existe déjà. Essayez de vous connecter.'
        : 'Le compte n\'a pas pu être créé : ' + e.message);
    }
    const uid = cred.user.uid;
    try{
      const now = new Date().toISOString();
      const batch = db.batch();
      batch.set(db.collection('users').doc(uid), { username, nom, role:'Super Admin', active:true, mustChangePassword:false, createdAt: now, createdBy:'Première installation' });
      batch.set(db.collection('appdata').doc('setup'), { done:true, by: uid, at: now });
      await batch.commit();
    }catch(e){
      console.error('Première installation refusée', e);
      try{ await cred.user.delete(); }catch(err){}
      setupInProgress = false;
      needsSetup = false;
      loginError = "La première installation a déjà été faite, ou a été refusée par le service de données. Connectez-vous avec le compte Super Admin existant.";
      renderLogin();
      return;
    }
    setupInProgress = false;
    needsSetup = false;
    loginError = '';
    await handleAuthUser(auth.currentUser);
  });
}

const ROLE_MIGRATION = { 'Administrateur':'Admin', 'Coordinateur':'Responsable', 'Agent de terrain':'Agent' };

function applyConfig(cfg){
  if(cfg.problems && cfg.problems.length) PROBLEMS = cfg.problems;
  if(cfg.pieces && cfg.pieces.length) PIECES_STANDARD = cfg.pieces;
  if(cfg.destinations && cfg.destinations.length) DESTINATIONS = cfg.destinations;
  if(cfg.settings) appSettings = cfg.settings;
  if(cfg.piecesParProbleme) PIECES_PAR_PROBLEME = cfg.piecesParProbleme;
  if(cfg.legacyUsers) legacyUsers = cfg.legacyUsers;
  // Ancien format : la liste « users » contenait les mots de passe en clair.
  // On ne garde que le nom, l'identifiant et le rôle, pour recréer les comptes.
  if(cfg.users && cfg.users.length){
    const known = new Set(legacyUsers.map(u=>u.username));
    cfg.users.forEach(u=>{
      if(u && u.username && !known.has(u.username)) legacyUsers.push({ username:u.username, nom:u.nom||'', role: ROLE_MIGRATION[u.role] || u.role || 'Agent' });
    });
    return true; // la configuration doit être réenregistrée sans les mots de passe
  }
  return false;
}

async function loadAppData(){
  stopSync();
  try{
    const snap = await db.collection('appdata').doc('dossiers').get();
    dossiers = snap.exists && snap.data().value ? JSON.parse(snap.data().value) : [];
  }catch(e){ dossiers = []; console.error(e); }
  formDraft = { id: nextId() };

  try{
    const snap = await db.collection('appdata').doc('config').get();
    if(snap.exists && snap.data().value){
      const needsCleanup = applyConfig(JSON.parse(snap.data().value));
      if(needsCleanup && canWriteConfig()) await saveConfig();
    } else if(canWriteConfig()){
      await saveConfig();
    }
  }catch(e){ console.error('Erreur de chargement de la configuration', e); }

  try{
    const snap = await db.collection('appdata').doc('logs').get();
    appLogs = snap.exists && snap.data().value ? JSON.parse(snap.data().value) : [];
  }catch(e){ appLogs = []; }

  await loadUsers();

  // Synchronisation en temps réel : si un collaborateur enregistre un
  // dossier, on récupère la mise à jour automatiquement.
  syncUnsubscribers.push(db.collection('appdata').doc('dossiers').onSnapshot(snap=>{
    if(!snap.exists) return;
    dossiers = snap.data().value ? JSON.parse(snap.data().value) : [];
    if(currentUser && (view==='list' || view==='dash')) render();
  }, err=> console.error('Erreur de synchronisation', err)));

  syncUnsubscribers.push(db.collection('appdata').doc('config').onSnapshot(snap=>{
    if(!snap.exists) return;
    try{
      applyConfig(JSON.parse(snap.data().value));
      if(currentUser && view==='settings') render();
    }catch(e){}
  }, err=> console.error('Erreur de synchronisation config', err)));
}

// Liste des comptes : visible uniquement par les administrateurs.
async function loadUsers(){
  users = [];
  if(!currentUser || !isAdminOrAbove(currentUser.role)) return;
  try{
    const snap = await db.collection('users').get();
    users = snap.docs.map(d=>({ uid: d.id, ...d.data() }))
      .sort((a,b)=> String(a.nom||'').localeCompare(String(b.nom||''), 'fr'));
  }catch(e){ console.error('Erreur de chargement des utilisateurs', e); }
}

async function saveConfig(){
  if(!dbReady) return;
  try{
    await db.collection('appdata').doc('config').set({ value: JSON.stringify({
      legacyUsers, problems: PROBLEMS, pieces: PIECES_STANDARD, destinations: DESTINATIONS, settings: appSettings, piecesParProbleme: PIECES_PAR_PROBLEME
    }) });
  }catch(e){ console.error('Erreur de sauvegarde de la configuration', e); alert('Erreur de sauvegarde : ' + e.message); }
}

async function addLog(action, details){
  appLogs.unshift({ date: new Date().toISOString(), user: currentUser ? currentUser.nom : 'Système', action, details: details||'' });
  if(appLogs.length > 300) appLogs = appLogs.slice(0, 300);
  if(!dbReady) return;
  try{
    await db.collection('appdata').doc('logs').set({ value: JSON.stringify(appLogs) });
  }catch(e){ console.error('Erreur de sauvegarde du journal', e); }
}

async function login(username, password){
  const u = String(username||'').trim().toLowerCase();
  if(!dbReady || !auth){ loginError = t('login_offline'); renderLogin(); return; }
  if(!u || !password){ loginError = t('login_error'); renderLogin(); return; }
  loginError = '';
  try{
    await auth.signInWithEmailAndPassword(usernameToEmail(u), password);
    // La suite (profil, données, ouverture de la plateforme) est gérée par startAuthListener().
  }catch(e){
    loginError = e.code==='auth/too-many-requests' ? t('login_locked')
      : e.code==='auth/network-request-failed' ? t('login_network')
      : t('login_error');
    renderLogin();
  }
}

function enterApp(){
  loginError = '';
  addLog('Connexion', `${currentUser.nom} (${currentUser.role})`);
  try{
    if(!formDraft.id) formDraft.id = nextId();
    document.getElementById('login-root').style.display = 'none';
    document.getElementById('app-root').style.display = 'flex';
    render();
    if(currentUser.mustChangePassword) openPasswordModal(true);
  }catch(err){
    alert('Erreur au chargement de la plateforme : ' + err.message);
    console.error(err);
  }
}

async function logout(){
  stopSync();
  currentUser = null;
  users = [];
  document.getElementById('app-root').style.display = 'none';
  if(auth) await auth.signOut();
  renderLogin();
}

/* --- Changement de mot de passe (par l'utilisateur lui-même) --- */
function openPasswordModal(forced){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-back">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pw-title" style="max-width:440px;">
      <h2 id="pw-title">Changer mon mot de passe</h2>
      ${forced ? `<div class="alert alert-warn">${ico('lock')} <div>Votre compte a été créé avec un mot de passe provisoire. Choisissez maintenant votre propre mot de passe.</div></div>` : ''}
      <div id="pw-error" class="login-error" style="display:none;" role="alert"></div>
      <div class="field" style="margin-bottom:12px;"><label for="pw-current">Mot de passe actuel</label><input id="pw-current" type="password" autocomplete="current-password"></div>
      <div class="field" style="margin-bottom:12px;"><label for="pw-new">Nouveau mot de passe</label><input id="pw-new" type="password" autocomplete="new-password" aria-describedby="pw-help"><span id="pw-help" style="font-size:12.5px; color:var(--ink-soft);">Au moins ${MIN_PASSWORD_LENGTH} caractères.</span></div>
      <div class="field"><label for="pw-confirm">Confirmer le nouveau mot de passe</label><input id="pw-confirm" type="password" autocomplete="new-password"></div>
      <div class="modal-actions">
        ${forced ? '' : `<button type="button" class="btn btn-ghost" id="pw-cancel">Annuler</button>`}
        <button type="button" class="btn btn-primary" id="pw-save">Enregistrer</button>
      </div>
    </div>
  </div>`;
  const err = msg=>{ const el=document.getElementById('pw-error'); el.textContent = msg; el.style.display = msg ? 'block' : 'none'; };
  const cancel = document.getElementById('pw-cancel');
  if(cancel) cancel.addEventListener('click', ()=>{ root.innerHTML = ''; });
  document.getElementById('pw-current').focus();
  document.getElementById('pw-save').addEventListener('click', async ()=>{
    const current = document.getElementById('pw-current').value;
    const next = document.getElementById('pw-new').value;
    const confirmPw = document.getElementById('pw-confirm').value;
    if(!current){ err('Saisissez votre mot de passe actuel.'); return; }
    if(next.length < MIN_PASSWORD_LENGTH){ err(`Le nouveau mot de passe doit contenir au moins ${MIN_PASSWORD_LENGTH} caractères.`); return; }
    if(next !== confirmPw){ err('Les deux nouveaux mots de passe ne sont pas identiques.'); return; }
    if(next === current){ err("Le nouveau mot de passe doit être différent de l'actuel."); return; }
    try{
      const user = auth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, current);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(next);
      if(currentUser.mustChangePassword){
        await db.collection('users').doc(currentUser.uid).update({ mustChangePassword:false });
        currentUser.mustChangePassword = false;
      }
      addLog('Mot de passe modifié', currentUser.nom);
      root.innerHTML = '';
      showToast('Mot de passe modifié');
    }catch(e){
      err(e.code==='auth/wrong-password' || e.code==='auth/invalid-credential' ? 'Le mot de passe actuel est incorrect.'
        : e.code==='auth/too-many-requests' ? t('login_locked')
        : 'Le mot de passe n\'a pas pu être modifié : ' + e.message);
    }
  });
}
document.addEventListener('click', e=>{
  if(e.target.closest && e.target.closest('#password-btn')) openPasswordModal(false);
});

async function saveData(){
  if(!dbReady){
    alert("Configuration Firebase manquante : les données ne sont pas encore sauvegardées en ligne (voir le commentaire CONFIGURATION FIREBASE en haut du fichier).");
    return;
  }
  try{
    await db.collection('appdata').doc('dossiers').set({ value: JSON.stringify(dossiers) });
  }catch(e){
    console.error('Erreur de sauvegarde', e);
    alert('Erreur de sauvegarde : ' + e.message);
  }
}

function nextId(){
  const year = 2026;
  const nums = dossiers
    .map(d => { const m = d.id.match(/PSC-EC(\d{4})-(\d{4})/); return m && +m[1]===year ? +m[2] : 0; })
    .concat([0]);
  const next = Math.max(...nums) + 1;
  return `PSC-EC${year}-${String(next).padStart(4,'0')}`;
}

function nextReceiptNumber(){
  const year = 2026;
  const nums = dossiers
    .map(d => { const m = (d.paiement_recu||'').match(/REC-(\d{4})-(\d{4})/); return m && +m[1]===year ? +m[2] : 0; })
    .concat([0]);
  const next = Math.max(...nums) + 1;
  return `REC-${year}-${String(next).padStart(4,'0')}`;
}

function showConfirmModal(message){
  let modal = document.getElementById('app-confirm-modal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'app-confirm-modal';
    modal.style.cssText = 'position:fixed; inset:0; background:rgba(18,49,40,0.55); display:flex; align-items:center; justify-content:center; z-index:10000;';
    document.body.appendChild(modal);
  }
  modal.innerHTML = `
    <div style="background:var(--paper-raised); border-radius:10px; padding:28px 26px; max-width:320px; width:90%; text-align:center; box-shadow:0 12px 32px rgba(0,0,0,0.25);">
      <div style="width:48px; height:48px; border-radius:50%; background:var(--brand-dark); color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;">${ico('check')}</div>
      <p style="font-size:15px; font-weight:600; color:var(--ink); margin:0 0 20px;">${message}</p>
      <button type="button" id="app-confirm-ok-btn" class="btn btn-primary" style="width:100%;">OK</button>
    </div>`;
  modal.style.display = 'flex';
  document.getElementById('app-confirm-ok-btn').addEventListener('click', ()=>{ modal.style.display = 'none'; });
}

function showToast(message){
  let toast = document.getElementById('app-toast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'app-toast';
    toast.style.cssText = 'position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-20px); background:var(--brand-dark); color:#fff; padding:11px 22px; border-radius:6px; font-size:13.5px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,0.2); z-index:9999; opacity:0; transition:opacity .25s, transform .25s; display:flex; align-items:center; gap:8px;';
    document.body.appendChild(toast);
  }
  toast.innerHTML = `${ico('check')} ${message}`;
  clearTimeout(toast._hideTimer);
  requestAnimationFrame(()=>{
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
  });
  toast._hideTimer = setTimeout(()=>{
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(-20px)';
  }, 5000);
}

function setPrintPageSize(size){
  let styleEl = document.getElementById('dynamic-page-size');
  if(!styleEl){
    styleEl = document.createElement('style');
    styleEl.id = 'dynamic-page-size';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = size ? `@page{ size:${size}; margin:10mm; }` : '';
}

function findSimilar(nom, prenom, dob, excludeId){
  const norm = s => (s||'').trim().toLowerCase();
  return dossiers.filter(d =>
    d.id!==excludeId && norm(d.nom)===norm(nom) && norm(d.prenom)===norm(prenom) &&
    (!dob || !d.dob || d.dob===dob)
  );
}

function captureStep(formEl, draft){
  const fd = new FormData(formEl);
  for(const [k,v] of fd.entries()) draft[k]=v;
}

function wireFilterGeographyCascade(){

  }

const MAX_DATA_URL_LENGTH = 200000; // ~150 Ko en base64

function wireDocUploads(form, draft, rerender){
  form.querySelectorAll('.doc-file-input').forEach(input=>{
    input.addEventListener('change', async ()=>{
      const file = input.files[0];
      if(!file) return;
      try{
        const dataUrl = await compressImageFile(file, 1000, 0.6);
        if(dataUrl.length > MAX_DATA_URL_LENGTH){
          alert("Le fichier reste trop volumineux même compressé. Essayez une photo moins détaillée ou recadrée.");
          return;
        }
        captureStep(form, draft);
        draft[input.dataset.key] = { fileData: dataUrl, fileName: file.name };
        rerender();
      }catch(e){ alert("Erreur lors du chargement du fichier."); console.error(e); }
    });
  });
  form.querySelectorAll('.doc-file-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      captureStep(form, draft);
      draft[btn.dataset.key] = null;
      rerender();
    });
  });
}

function wirePieceFileUploads(form, draft, rerender){
  form.querySelectorAll('.piece-file-input').forEach(input=>{

        if(dataUrl.length > MAX_DATA_URL_LENGTH){
          alert("Le fichier reste trop volumineux même compressé. Essayez une photo moins détaillée ou recadrée.");
          return;
        }
        captureStep(form, draft);
        const piece = (draft.pieces||[]).find(p=>p.id===input.dataset.pieceId);

      const piece = (draft.pieces||[]).find(p=>p.id===btn.dataset.pieceId);

      rerender();
    });
  });
}

function wireCycle(form, draft, rerender){
  const typeCasSel = form.querySelector('#type-cas-select');
  if(typeCasSel) typeCasSel.addEventListener('change', ()=>{
    captureStep(form, draft);
    draft.type_cas = typeCasSel.value;
    draft.cycle_stage = 0;
    rerender();
  });
  form.querySelectorAll('.cycle-decision-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      captureStep(form, draft);
      draft[btn.dataset.field] = btn.dataset.value;
      rerender();
    });
  });
  const incidentBtn = form.querySelector('#incident-add-btn');
  if(incidentBtn) incidentBtn.addEventListener('click', ()=>{
    const motifEl = form.querySelector('#incident-motif');
    const dateEl = form.querySelector('#incident-date');
    const motif = (motifEl.value||'').trim();
    if(!motif){ alert('Le motif est requis pour enregistrer un incident.'); return; }
    captureStep(form, draft);
    draft.incidents = draft.incidents || [];
    draft.incidents.push({ motif, date: dateEl.value || new Date().toISOString().slice(0,10) });
    draft[incidentBtn.dataset.field] = null;
    rerender();
  });
  form.querySelectorAll('.cycle-doc-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      captureStep(form, draft);
      const field = btn.dataset.field; const idx = +btn.dataset.index;
      if(draft[field]) draft[field].splice(idx,1);
      rerender();
    });
  });
  form.querySelectorAll('.cycle-doc-file-input').forEach(input=>{
    input.addEventListener('change', async ()=>{
      const file = input.files[0];
      if(!file) return;
      const field = input.dataset.field;
      const nameInp = form.querySelector(`.cycle-doc-name[data-field="${field}"]`);
      const nom = (nameInp && nameInp.value.trim()) || file.name;
      try{
        const dataUrl = await compressImageFile(file, 1000, 0.6);
        captureStep(form, draft);
        draft[field] = draft[field] || [];
        draft[field].push({ nom, fileData: dataUrl });
        draft.pieces = draft.pieces || [];
        draft.pieces.push({ id: uid(), nom, statut:'Fournie', fileData: dataUrl, fileName: nom });
        rerender();
      }catch(e){ alert("Erreur lors du chargement du fichier."); console.error(e); }
    });
  });
}

  const communeInp = root.querySelector('input[name="commune"]');
  const centreInp = root.querySelector('input[name="centre"]');

  const refreshDeptList = ()=>{
    if(!deptInp) return;
    const depts = REGIONS_DEPARTEMENTS[regionInp && regionInp.value] || Object.values(REGIONS_DEPARTEMENTS).flat();
    const dl = root.querySelector('#departement-list');
    if(dl) dl.innerHTML = depts.map(dd=>`<option value="${dd}">`).join('');
  };
  const refreshCommuneList = ()=>{
    if(!communeInp) return;
    const communes = COMMUNES_PAR_DEPARTEMENT[deptInp && deptInp.value] || [];
    const dl = root.querySelector('#commune-list');
    if(dl) dl.innerHTML = communes.map(c=>`<option value="${c}">`).join('');
  };
  const refreshCentreList = ()=>{
    if(!centreInp) return;
    const options = [];
    if(communeInp && communeInp.value) options.push(`Centre d'état civil de ${communeInp.value}`);
    const chefLieu = DEPT_CHEFLIEU[deptInp && deptInp.value];
    if(chefLieu) options.push(`Centre d'état civil de ${chefLieu}`);
    const dl = root.querySelector('#centre-list');
    if(dl) dl.innerHTML = options.map(o=>`<option value="${o}">`).join('');
  };

  if(regionInp) regionInp.addEventListener('change', ()=>{ refreshDeptList(); });
  if(deptInp) deptInp.addEventListener('change', ()=>{ refreshCommuneList(); refreshCentreList(); });
  if(communeInp) communeInp.addEventListener('change', ()=>{ refreshCentreList(); });
}

    draft.pieces.push({ id: uid(), nom: name, statut:'Manquante' });

  });
  form.querySelectorAll('.piece-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      captureStep(form, draft);
      draft.pieces = (draft.pieces||[]).filter(p=>p.id!==btn.dataset.pieceId);
      rerender();
    });
  });
  form.querySelectorAll('.piece-statut').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      captureStep(form, draft);
      const p = (draft.pieces||[]).find(x=>x.id===sel.dataset.pieceId);
      if(p) p.statut = sel.value;
      rerender();
    });
  });
  const addEnvoiBtn = document.getElementById('add-envoi-btn');
  if(addEnvoiBtn) addEnvoiBtn.addEventListener('click', ()=>{
    captureStep(form, draft);
    const dest = document.getElementById('new-envoi-dest').value;
    const motif = document.getElementById('new-envoi-motif').value.trim();
    const date = document.getElementById('new-envoi-date').value;
    if(newEnvoiPieces.length===0){
      alert("Sélectionnez au moins une pièce avant d'envoyer ce dossier vers une destination.");
      return;
    }
    draft.envois = draft.envois || [];
    draft.envois.push({ id: uid(), destination: dest, motif, date_envoi: date, statut:'En attente', date_retour:'', pieces_envoyees:[...newEnvoiPieces] });
    newEnvoiPieces = [];
    newEnvoiMotif = '';
    newEnvoiDest = DESTINATIONS[0];
    newEnvoiDate = new Date().toISOString().slice(0,10);
    openPiecePicker = null;
    rerender();
  });
  form.querySelectorAll('.envoi-piece-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      captureStep(form, draft);
      const e = (draft.envois||[]).find(x=>x.id===cb.dataset.envoiId);
      if(e){
        e.pieces_envoyees = e.pieces_envoyees || [];
        if(cb.checked){ if(!e.pieces_envoyees.includes(cb.dataset.pieceId)) e.pieces_envoyees.push(cb.dataset.pieceId); }
        else{ e.pieces_envoyees = e.pieces_envoyees.filter(id=>id!==cb.dataset.pieceId); }
      }
      rerender();
    });
  });
  form.querySelectorAll('.new-envoi-piece-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      captureStep(form, draft);
      if(cb.checked){ if(!newEnvoiPieces.includes(cb.dataset.pieceId)) newEnvoiPieces.push(cb.dataset.pieceId); }
      else{ newEnvoiPieces = newEnvoiPieces.filter(id=>id!==cb.dataset.pieceId); }
      rerender();
    });
  });
  form.querySelectorAll('.envoi-piece-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{ captureStep(form, draft); openPiecePicker = btn.dataset.envoiId; rerender(); });
  });
  form.querySelectorAll('.envoi-piece-done').forEach(btn=>{
    btn.addEventListener('click', ()=>{ captureStep(form, draft); openPiecePicker = null; rerender(); });
  });
  const newEnvoiToggle = document.getElementById('new-envoi-piece-toggle');
  if(newEnvoiToggle) newEnvoiToggle.addEventListener('click', ()=>{
    captureStep(form, draft);
    newEnvoiDest = document.getElementById('new-envoi-dest').value;
    newEnvoiMotif = document.getElementById('new-envoi-motif').value;
    newEnvoiDate = document.getElementById('new-envoi-date').value;
    openPiecePicker = '__new__';
    rerender();
  });
  const newEnvoiDone = document.getElementById('new-envoi-piece-done');
  if(newEnvoiDone) newEnvoiDone.addEventListener('click', ()=>{ captureStep(form, draft); openPiecePicker = null; rerender(); });
  const newEnvoiDestSel = document.getElementById('new-envoi-dest');
  if(newEnvoiDestSel) newEnvoiDestSel.addEventListener('change', ()=>{
    captureStep(form, draft);
    newEnvoiDest = newEnvoiDestSel.value;
    newEnvoiMotif = document.getElementById('new-envoi-motif').value;
    newEnvoiDate = document.getElementById('new-envoi-date').value;
    rerender();
  });
  const newEnvoiMotifInp = document.getElementById('new-envoi-motif');
  if(newEnvoiMotifInp) newEnvoiMotifInp.addEventListener('blur', ()=>{ newEnvoiMotif = newEnvoiMotifInp.value; });
  const newEnvoiDateInp = document.getElementById('new-envoi-date');
  if(newEnvoiDateInp) newEnvoiDateInp.addEventListener('change', ()=>{ newEnvoiDate = newEnvoiDateInp.value; });

  form.querySelectorAll('.envoi-destination').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      captureStep(form, draft);
      const e = (draft.envois||[]).find(x=>x.id===sel.dataset.envoiId);
      if(e) e.destination = sel.value;
      rerender();
    });
  });
  form.querySelectorAll('.envoi-motif').forEach(inp=>{
    inp.addEventListener('blur', ()=>{
      const e = (draft.envois||[]).find(x=>x.id===inp.dataset.envoiId);
      if(e) e.motif = inp.value;
    });
  });
  form.querySelectorAll('.envoi-date-envoi').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      captureStep(form, draft);
      const e = (draft.envois||[]).find(x=>x.id===inp.dataset.envoiId);
      if(e) e.date_envoi = inp.value;
      rerender();
    });
  });
  form.querySelectorAll('.envoi-motif-retour').forEach(inp=>{
    inp.addEventListener('blur', ()=>{
      const e = (draft.envois||[]).find(x=>x.id===inp.dataset.envoiId);
      if(e) e.motif_retour = inp.value;
    });
  });
  form.querySelectorAll('.envoi-statut').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      captureStep(form, draft);
      const e = (draft.envois||[]).find(x=>x.id===sel.dataset.envoiId);
      if(e) e.statut = sel.value;
      rerender();
    });
  });
  form.querySelectorAll('.envoi-retour').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      captureStep(form, draft);
      const e = (draft.envois||[]).find(x=>x.id===inp.dataset.envoiId);
      if(e) e.date_retour = inp.value;
      rerender();
    });
  });
  form.querySelectorAll('.envoi-cancel').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm("Annuler cet envoi ? Cette action est définitive.")) return;
      captureStep(form, draft);
      draft.envois = (draft.envois||[]).filter(x=>x.id!==btn.dataset.envoiId);
      if(openPiecePicker===btn.dataset.envoiId) openPiecePicker = null;
      rerender();
    });
  });
}

function fv(v){ return v ? String(v).replace(/"/g,'&quot;') : ''; }
function selectOpts(options, current){
  return `<option value=""${!current?' selected':''}>—</option>` +
    options.map(o=>`<option${o===current?' selected':''}>${o}</option>`).join('');
}

        <span style="background:var(--paper-raised); border:1px solid var(--line); color:var(--green-deep); padding:6px 12px; border-radius:20px; font-size:13px; display:inline-flex; align-items:center; gap:6px;">
          ${fv(m)}
          <button type="button" class="motif-remove-btn" data-value="${fv(m)}" style="all:unset; cursor:pointer; color:var(--red); font-weight:700; line-height:1;" aria-label="Retirer" title="Retirer">${ico('x')}</button>

  <div class="field">

  <div class="field" style="margin-top:10px;"><label>Autre (préciser)</label><input name="motif_non_declaration_autre" value="${fv(d.motif_non_declaration_autre)}"></div>

  <h3 style="font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin:20px 0 4px;">Témoins</h3>
  <p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 12px;">Obligatoire : 2 témoins majeurs ayant assisté à la naissance ou connaissant la famille.</p>
  <p style="font-size:13px; font-weight:600; color:var(--ink); margin:0 0 8px;">Témoin 1</p>
  <div class="grid">
    <div class="field"><label>Nom</label><input name="temoin1_nom" value="${fv(d.temoin1_nom)}"></div>
    <div class="field"><label>Prénom</label><input name="temoin1_prenom" value="${fv(d.temoin1_prenom)}"></div>
    <div class="field"><label>CNI N°</label><input name="temoin1_cni" value="${fv(d.temoin1_cni)}"></div>
    <div class="field"><label>Délivrée le</label><input type="date" name="temoin1_cni_du" value="${fv(d.temoin1_cni_du)}"></div>
    <div class="field"><label>À (lieu)</label><input name="temoin1_cni_a" value="${fv(d.temoin1_cni_a)}"></div>
    <div class="field"><label>Lien avec la famille</label><input name="temoin1_lien" value="${fv(d.temoin1_lien)}"></div>
    <div class="field"><label>Téléphone</label><input name="temoin1_tel" value="${fv(d.temoin1_tel)}"></div>
    <div class="field"><label>NIU</label><input name="temoin1_niu" value="${fv(d.temoin1_niu)}"></div>

  <p style="font-size:13px; font-weight:600; color:var(--ink); margin:18px 0 8px;">Témoin 2</p>
  <div class="grid">
    <div class="field"><label>Nom</label><input name="temoin2_nom" value="${fv(d.temoin2_nom)}"></div>
    <div class="field"><label>Prénom</label><input name="temoin2_prenom" value="${fv(d.temoin2_prenom)}"></div>
    <div class="field"><label>CNI N°</label><input name="temoin2_cni" value="${fv(d.temoin2_cni)}"></div>
    <div class="field"><label>Délivrée le</label><input type="date" name="temoin2_cni_du" value="${fv(d.temoin2_cni_du)}"></div>
    <div class="field"><label>À (lieu)</label><input name="temoin2_cni_a" value="${fv(d.temoin2_cni_a)}"></div>
    <div class="field"><label>Lien avec la famille</label><input name="temoin2_lien" value="${fv(d.temoin2_lien)}"></div>
    <div class="field"><label>Téléphone</label><input name="temoin2_tel" value="${fv(d.temoin2_tel)}"></div>
    <div class="field"><label>NIU</label><input name="temoin2_niu" value="${fv(d.temoin2_niu)}"></div>
  </div>

  <h3 style="font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin:20px 0 12px;">Engagement</h3>
  <div class="grid">
    <div class="field"><label>Je soussigné(e) (déclarant)</label><input name="declarant_nom" value="${fv(d.declarant_nom)}"></div>
    <div class="field"><label>Fait à</label><input name="engagement_lieu" value="${fv(d.engagement_lieu)}"></div>
    <div class="field"><label>Le</label><input type="date" name="engagement_date" value="${fv(d.engagement_date)}"></div>
  </div>

  <button type="button" class="btn btn-ghost" id="print-formulaire-btn" style="margin-top:20px;" ${printGateAttrs(d)}>${ico('printer')} Imprimer le formulaire pour signature</button>
  ${!dossiers.some(x=>x.id===d.id) ? `<p style="font-size:11.5px; color:var(--ink-soft); margin-top:8px;">Enregistrez le dossier pour activer l'impression.</p>` : ''}`},
{ title:"4. Traitement du dossier", body: d => {
  {
    const expectedNames = PIECES_PAR_PROBLEME[d.probleme] || PIECES_STANDARD;
    const mismatch = !d.pieces || d.pieces.length !== expectedNames.length || !expectedNames.every((n,i)=>d.pieces[i] && d.pieces[i].nom===n);
    if(mismatch) d.pieces = expectedNames.map(nom => ({ id: uid(), nom, statut:'Manquante' }));
  }
  if(!d.envois) d.envois = [];
  return `
  <div style="background:var(--brand-dark); border-radius:8px; padding:12px 14px; margin-bottom:18px;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0;">
      <span style="font-size:11px; color:#B8C4BC;">Type de problème</span>
      <span style="font-family:'Fira Sans',system-ui,sans-serif; font-size:14px; color:#fff;">${fv(d.probleme) || 'Non renseigné'}</span>
    </div>
    <div style="height:1px; background:rgba(255,255,255,0.15); margin:6px 0;"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0;">
      <span style="font-size:11px; color:#B8C4BC;">Motif de non-déclaration (90 jours)</span>
      <span style="font-family:'Fira Sans',system-ui,sans-serif; font-size:14px; color:#fff; text-align:right;">${(d.motif_non_declaration||[]).join(', ') || 'Non renseigné'}</span>
    </div>
  </div>
  <div class="grid">
    <div class="field"><label>Agent qui suit le dossier</label><input name="agent_suivi" value="${fv(d.agent_suivi)}"></div>
    <div class="field"><label>Contact de l'agent</label><input name="agent_suivi_contact" value="${fv(d.agent_suivi_contact)}"></div>
    <div class="field"><label>Situation actuelle du dossier</label>
      ${searchableField('situation_dossier', SITUATIONS_DOSSIER, d.situation_dossier)}
    </div>
  </div>
  <div class="field" style="margin-top:12px;"><label>Note (utile notamment si suspendu)</label>
    <textarea name="situation_dossier_note" rows="2">${fv(d.situation_dossier_note)}</textarea></div>

  <h3 style="font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin:20px 0 4px;">Pièces jointes du dossier</h3>
  <p style="font-size:12px; color:var(--ink-soft); margin:0 0 4px;">Liste selon le type de problème (${fv(d.probleme) || 'non renseigné'}). Images uniquement, compressées automatiquement — limite ~150 Ko par fichier.</p>
  <div id="pieces-list">
    ${d.pieces.map(p=>`
      <div style="display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap;">
        <span style="flex:1; font-size:13.5px; min-width:140px;">${fv(p.nom)}</span>
        <select class="piece-statut" data-piece-id="${p.id}" style="font-size:13px; padding:5px 8px; border:1px solid var(--line); border-radius:5px; background:var(--paper-raised);">
          <option${p.statut==='Manquante'?' selected':''}>Manquante</option>
          <option${p.statut==='Fournie'?' selected':''}>Fournie</option>
        </select>
        ${p.statut==='Fournie' ? (
          p.fileData ? `
          <span style="display:flex; align-items:center; gap:6px; font-size:11.5px;">
            <img src="${p.fileData}" style="width:26px; height:26px; object-fit:cover; border-radius:4px; border:1px solid var(--line);">
            <a href="${p.fileData}" target="_blank" style="color:var(--green-deep); text-decoration:underline; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${fv(p.fileName)||'fichier'}</a>
            <button type="button" class="piece-file-remove" data-piece-id="${p.id}" style="all:unset; cursor:pointer; color:var(--red); font-size:13px;" aria-label="Retirer" title="Retirer">${ico('x')}</button>
          </span>`
          : `<label style="border:1px solid var(--green-deep); color:var(--green-deep); padding:4px 10px; border-radius:5px; font-size:11.5px; cursor:pointer;">
              ${ico('clip')} Charger
              <input type="file" accept="image/*" class="piece-file-input" data-piece-id="${p.id}" style="display:none;">
            </label>`
        ) : `<span style="font-size:11px; color:var(--ink-soft);">Chargement dispo une fois fournie</span>`}
        <button type="button" class="piece-remove" data-piece-id="${p.id}" style="all:unset; cursor:pointer; color:var(--red); font-size:14px; padding:0 4px;" aria-label="Retirer" title="Retirer">${ico('x')}</button>
      </div>`).join('')}
  </div>
  <div style="display:flex; gap:8px; margin-top:12px;">
    <input id="new-piece-name" placeholder="Ajouter une pièce propre à ce dossier…" style="flex:1; font-family:inherit; font-size:13.5px; padding:8px 10px; border:1px solid var(--line); border-radius:5px;">
    <button type="button" class="btn btn-ghost" id="add-piece-btn">+ Ajouter</button>
  </div>

  ${etatActuelBanner(d)}

  <h3 style="font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin:20px 0 8px;">Cycle du dossier</h3>
  <div class="field" style="margin-bottom:14px;"><label>Type de Cycle</label>
    <select name="type_cas" id="type-cas-select">
      <option value=""${!d.type_cas?' selected':''}>— Choisir —</option>
      ${Object.keys(CYCLES).map(c=>`<option${c===d.type_cas?' selected':''}>${c}</option>`).join('')}
    </select>
  </div>
  ${d.type_cas && CYCLES[d.type_cas] ? (()=>{
    const stages = CYCLES[d.type_cas];
    const current = computeCycleStage(d);
    d.cycle_stage = current;
    const pct = Math.round(((current+1)/stages.length)*100);
    return `
    <div style="background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:20px;">
      <div style="font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;">${current+1} / ${stages.length} étapes franchies — mise à jour automatique</div>
      <div style="background:var(--line-soft); border-radius:20px; height:8px; margin-bottom:18px; overflow:hidden;">
        <div style="background:var(--ok-solid); height:100%; width:${pct}%;"></div>
      </div>
      ${stages.map((label,i)=>{
        const state = i<current ? 'fait' : (i===current ? 'encours' : 'avenir');
        const badge = state==='fait' ? `<span style="font-size:11px; color:var(--ok); background:var(--ok-bg); padding:3px 9px; border-radius:20px;">Fait</span>`
          : state==='encours' ? `<span style="font-size:11px; color:var(--gold); background:var(--warn-bg); padding:3px 9px; border-radius:20px; border:1px solid var(--warn-line);">En cours</span>`
          : `<span style="font-size:11px; color:var(--ink-soft);">À venir</span>`;
        const dot = state==='fait' ? `<span style="width:26px; height:26px; border-radius:50%; background:var(--ok-solid); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${ico('check')}</span>`
          : state==='encours' ? `<span style="width:26px; height:26px; border-radius:50%; background:var(--gold-solid); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">●</span>`
          : `<span style="width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:inline-block; flex-shrink:0;"></span>`;
        const meta = stageMeta(d.type_cas, i);
        return `
        <div style="display:flex; align-items:center; gap:12px; padding:12px 8px; border-bottom:1px solid var(--line-soft); ${state==='encours'?'background:var(--warn-bg); border-radius:6px;':''}">
          ${dot}
          <span style="flex:1; font-size:15px; ${state==='avenir'?'color:var(--ink-soft);':state==='encours'?'font-weight:600;':''}">${label}</span>
          ${badge}
        </div>
        ${(meta && meta.kind==='envoi' && state!=='fait') ? `
        <p style="font-size:12px; color:var(--ink-soft); margin:0 0 10px;">Créez un envoi vers <strong>${meta.dest}</strong> dans "Suivi des envois" ci-dessous pour valider cette étape automatiquement.</p>` : ''}
        ${(meta && meta.kind==='decision') ? `
        <div style="border:1px dashed var(--gold); border-radius:6px; padding:14px; margin:8px 0 10px;">
          <div style="font-weight:600; font-size:13px; margin-bottom:10px;">Décision ${meta.dest||'du TPI'}</div>
          ${!d[meta.field] ? `
          <div style="display:flex; gap:10px;">
            <button type="button" class="cycle-decision-btn" data-field="${meta.field}" data-value="concluant" style="background:var(--ok-solid); color:#fff; border:none; padding:9px 18px; border-radius:6px; font-size:13px; cursor:pointer;">${ico('check-circle')} Concluant</button>
            <button type="button" class="cycle-decision-btn" data-field="${meta.field}" data-value="rejete" style="background:var(--red-solid); color:#fff; border:none; padding:9px 18px; border-radius:6px; font-size:13px; cursor:pointer;">${ico('x-circle')} Rejeté</button>
          </div>` : d[meta.field]==='concluant' ? `
          <p style="font-size:13px; color:var(--ok); margin:0;">${ico('check-circle')} Retour concluant enregistré.</p>` : `
          <p style="font-size:13px; color:var(--red); margin:0 0 10px;">${ico('x-circle')} Dossier rejeté — remplissez le motif ci-dessous puis renvoyez le dossier.</p>
          ${(d.incidents||[]).length ? (d.incidents||[]).map(inc=>`
            <div style="background:var(--red-bg); border-radius:6px; padding:7px 9px; margin-bottom:6px; font-size:12.5px;">
              <strong>${fv(inc.date) || '—'}</strong> — ${fv(inc.motif)}
            </div>`).join('') : ''}
          <div class="field" style="margin-top:8px;"><label>Motif du rejet</label>
            <input id="incident-motif" placeholder="Ex : pièce manquante, erreur d'état civil…">
          </div>
          <div class="field" style="margin-top:6px; max-width:180px;"><label>Date</label>
            <input id="incident-date" type="date" value="${new Date().toISOString().slice(0,10)}">
          </div>
          <button type="button" class="btn" id="incident-add-btn" data-field="${meta.field}" style="margin-top:8px; background:var(--gold-solid); color:#fff; border:none;">Enregistrer le motif et renvoyer le dossier</button>
          `}
        </div>` : ''}
        ${(meta && meta.kind==='docs') ? `
        <div style="border:1px dashed var(--gold); border-radius:6px; padding:14px; margin:8px 0 10px;">
          <div style="font-weight:600; font-size:13px; margin-bottom:8px;">${meta.label}</div>
          ${(d[meta.field]||[]).length ? (d[meta.field]||[]).map((doc,di)=>`
            <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line-soft);">
              <img src="${doc.fileData}" style="width:26px; height:26px; object-fit:cover; border-radius:4px; border:1px solid var(--line);">
              <span style="flex:1; font-size:13px;">${fv(doc.nom)}</span>
              <button type="button" class="cycle-doc-remove" data-field="${meta.field}" data-index="${di}" style="all:unset; cursor:pointer; color:var(--red); font-size:13px;" aria-label="Retirer" title="Retirer">${ico('x')}</button>
            </div>`).join('') : `<p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 8px;">Aucun document chargé pour l'instant.</p>`}
          <div style="display:flex; gap:8px; margin-top:10px;">
            <input class="cycle-doc-name" data-field="${meta.field}" placeholder="Nom du document (ex : Jugement signé)" style="flex:1; font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--line); border-radius:5px;">
            <label style="border:1px solid var(--green-deep); color:var(--green-deep); padding:7px 14px; border-radius:5px; font-size:12.5px; cursor:pointer; white-space:nowrap;">
              ${ico('clip')} Charger
              <input type="file" accept="image/*" class="cycle-doc-file-input" data-field="${meta.field}" style="display:none;">
            </label>
          </div>
          <p style="font-size:11px; color:var(--ink-soft); margin-top:6px;">Ces documents seront proposés automatiquement pour les envois suivants (ex. vers la Mairie).</p>
        </div>` : ''}
        ${(CYCLE_TRANSMISSION_STAGE[d.type_cas]===i) ? `
        <div style="border:1px dashed var(--gold); border-radius:6px; padding:14px; margin:8px 0 10px;">
          <div style="font-weight:600; font-size:13px; margin-bottom:8px;">Pièces à transmettre à la Mairie</div>
          ${PIECES_ENVOI_MAIRIE.map(p=>`<div style="padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:13px;">• ${fv(p)}</div>`).join('')}
        </div>` : ''}`;
      }).join('')}
    </div>`;
  })() : `<p style="font-size:12.5px; color:var(--ink-soft);">Choisissez un type de cas pour afficher le cycle correspondant.</p>`}

  ${etatActuelBanner(d)}

  <h3 style="font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin:24px 0 12px;">Suivi des envois — destinations multiples</h3>
  <p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 12px;">Un dossier peut partir vers plusieurs destinations en parallèle (ex : TPI pour authentification, puis Mairie pour complément), chacune suivie et mise à jour indépendamment jusqu'à convergence.</p>
  <div id="envois-list">
    ${d.envois.length ? d.envois.map(e=>{
      const piecesNames = (e.pieces_envoyees||[]).map(pid => (d.pieces.find(p=>p.id===pid)||{}).nom).filter(Boolean);
      const noPieces = piecesNames.length===0;
      const pickerOpen = openPiecePicker === e.id;
      return `
      <div style="border:1px solid ${noPieces?'var(--warn-line)':'var(--line)'}; border-radius:6px; padding:10px 12px; margin-bottom:10px;">
        <div class="grid">
          <div class="field"><label>Destination</label>
            <select class="envoi-destination" data-envoi-id="${e.id}">${DESTINATIONS.map(dd=>`<option${dd===e.destination?' selected':''}>${dd}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Motif</label><input class="envoi-motif" data-envoi-id="${e.id}" value="${fv(e.motif)}"></div>
          <div class="field"><label>Date d'envoi</label><input type="date" class="envoi-date-envoi" data-envoi-id="${e.id}" value="${fv(e.date_envoi)}" min="2020-01-01" max="2035-12-31"></div>
          <div class="field"><label>Statut</label>
            <select class="envoi-statut" data-envoi-id="${e.id}">${ENVOI_STATUTS.map(s=>`<option${s===e.statut?' selected':''}>${s}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Date de retour</label><input type="date" class="envoi-retour" data-envoi-id="${e.id}" value="${fv(e.date_retour)}" min="2020-01-01" max="2035-12-31"></div>
          ${e.statut==='Retourné' ? `<div class="field"><label>Motif du retour</label><input class="envoi-motif-retour" data-envoi-id="${e.id}" value="${fv(e.motif_retour)}"></div>` : ''}
        </div>

        <div style="margin-top:12px; border-top:1px solid var(--line-soft); padding-top:10px;">
          ${pickerOpen ? `
            <div style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">Pièces envoyées vers ${fv(e.destination)} :</div>
            ${d.pieces.map(p=>{
              const conflict = pieceAlreadySentElsewhere(d, p.id, e.destination, e.id);
              const checked = (e.pieces_envoyees||[]).includes(p.id);
              return `<label style="display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0; ${conflict?'color:var(--ink-soft);':''}">
                <input type="checkbox" class="envoi-piece-check" data-envoi-id="${e.id}" data-piece-id="${p.id}" ${checked?'checked':''} ${conflict?'disabled':''}>
                ${fv(p.nom)}${conflict?` <em style="font-size:11px;">— déjà envoyé le ${fv(conflict.date_envoi)||'—'}</em>`:''}
              </label>`;
            }).join('')}
            <button type="button" class="btn btn-ghost envoi-piece-done" data-envoi-id="${e.id}" style="margin-top:8px; font-size:12.5px; padding:6px 12px;">Terminé</button>
          ` : `
            <div style="font-size:13px;">
              ${noPieces ? `<span style="color:var(--gold);">${ico('alert')} Aucune pièce associée à cet envoi</span>` : `<span style="color:var(--ink-soft);">Pièces :</span> ${piecesNames.join(', ')}`}
            </div>
            <button type="button" class="btn btn-ghost envoi-piece-toggle" data-envoi-id="${e.id}" style="margin-top:8px; font-size:12.5px; padding:6px 12px;">${noPieces?'Ajouter des pièces':'Modifier les pièces'}</button>
          `}
        </div>

        <button type="button" class="btn envoi-cancel" data-envoi-id="${e.id}" style="margin-top:10px; font-size:12.5px; padding:6px 12px; background:transparent; border:1px solid var(--red); color:var(--red); border-radius:5px; cursor:pointer;">Annuler cet envoi</button>
      </div>`;
    }).join('') : `<p style="color:var(--ink-soft); font-size:13px;">Aucun envoi enregistré pour l'instant.</p>`}
  </div>

  <p style="font-size:13px; font-weight:600; color:var(--ink); margin:20px 0 8px;">Nouvel envoi</p>
  <div class="grid">
    <div class="field"><label>Destination</label>
      <select id="new-envoi-dest">${DESTINATIONS.map(dd=>`<option${dd===newEnvoiDest?' selected':''}>${dd}</option>`).join('')}</select>
    </div>

function wizardHtml(d, step, submitLabel){
  const s = STEP_SECTIONS[step];

  const paymentBlocked = step===1 && !paymentSatisfied(d);
  return `
  ${step > 0 ? `
  <div style="display:flex; justify-content:space-between; align-items:center; background:var(--brand-dark); border-radius:8px; padding:10px 14px; margin-bottom:18px;">
    <span style="font-family:'Fira Sans',system-ui,sans-serif; font-size:15px; color:#fff;">${ico('user')} ${fv(d.nom) || '—'} ${fv(d.prenom) || ''}</span>
    <span style="font-size:11.5px; color:#B8C4BC;">${fv(d.id) || ''}</span>
  </div>` : ''}
  <div class="wizard-head">
    <div style="font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin-bottom:6px;">${t('step_page_current')}</div>
    <div class="wizard-title">${STEP_ICONS[step]} ${s.title}</div>
    <div class="wizard-progress"><div class="wizard-progress-fill" style="width:${((step+1)/STEP_SECTIONS.length)*100}%"></div></div>
    <div class="wizard-dots">
      ${STEP_SECTIONS.map((x,i)=>`
        <div style="display:flex; flex-direction:column; align-items:center; gap:3px;">
          <button type="button" class="wdot ${i===step?'active':''} ${i<step?'done':''}" data-step="${i}" style="font-size:15px;" aria-label="Étape ${i+1}">${i<step ? ico('check') : i+1}</button>
          <span style="font-size:9px; color:${i===step?'var(--green-deep)':'var(--ink-soft)'}; font-weight:${i===step?'600':'400'};">${STEP_LABELS[i]}</span>
        </div>`).join('')}
    </div>
  </div>
  <div class="section-block"${editLockLevel==='full'?' style="pointer-events:none; opacity:0.55;"':''}>${s.body(d)}</div>
  <div class="wizard-nav">
    <button type="button" class="btn btn-ghost" id="wiz-prev" ${step===0?'disabled style="visibility:hidden;"':''}>${t('btn_prev')}</button>
    ${editLockLevel==='full' ? '' : (
      step===1
        ? `<button type="button" class="btn" id="wiz-save-payment" ${paymentBlocked?'disabled':''} style="background:${paymentBlocked?'var(--line)':'var(--red-solid)'}; color:#fff; border:none; ${paymentBlocked?'cursor:not-allowed;':''}">${t('btn_save_payment')}</button>`
        : `<button type="button" class="btn btn-ghost" id="wiz-save-only">${t('btn_save_only')}</button>`
    )}
    ${isLast
      ? (editLockLevel==='full' ? '' : `<button type="submit" class="btn btn-primary">${submitLabel || t('btn_save')}</button>`)
      : `<button type="button" class="btn btn-primary" id="wiz-next" ${paymentBlocked?'disabled style="background:var(--line); cursor:not-allowed;"':''}>${t('btn_next')}</button>`}
  </div>`;
}

function badgeClass(index, closed){
  if(closed) return 'badge-done';
  if(index<=0) return 'badge-new';
  if(index===1 || index===2) return 'badge-mairie';
  if(index===3) return 'badge-tpi';
  return 'badge-new';
}

function setView(v){

function render(){
  const dashBtn = document.querySelector('nav button[data-view="dash"]');
  if(dashBtn) dashBtn.style.display = (currentUser && currentUser.role === 'Agent') ? 'none' : 'flex';
  const settingsBtn = document.querySelector('nav button[data-view="settings"]');
  if(settingsBtn) settingsBtn.style.display = (currentUser && currentUser.role !== 'Agent') ? 'flex' : 'none';
  if((view==='dash' || view==='settings') && currentUser && currentUser.role==='Agent') view = 'list';
  const badge = document.getElementById('user-badge');
  if(badge && currentUser) badge.innerHTML = `<strong>${currentUser.nom}</strong><br><span style="font-size:11px;">${currentUser.role}</span>`;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  const navHome = document.getElementById('nav-home'); if(navHome) navHome.textContent = t('nav_home');
  const navNew = document.getElementById('nav-new'); if(navNew) navNew.textContent = t('nav_new');
  const navList = document.getElementById('nav-list'); if(navList) navList.textContent = t('nav_list');
  const navDash = document.getElementById('nav-dash'); if(navDash) navDash.textContent = t('nav_dash');
  const navSettings = document.getElementById('nav-settings'); if(navSettings) navSettings.textContent = t('nav_settings');
  const logoutBtn = document.getElementById('logout-btn'); if(logoutBtn) logoutBtn.textContent = t('logout');
  const appLangFr = document.getElementById('app-lang-fr');
  const appLangEn = document.getElementById('app-lang-en');
  if(appLangFr) appLangFr.style.fontWeight = lang==='fr' ? '700' : '400';
  if(appLangFr) appLangFr.style.color = lang==='fr' ? '#fff' : '#B8C4BC';
  if(appLangEn) appLangEn.style.fontWeight = lang==='en' ? '700' : '400';
  if(appLangEn) appLangEn.style.color = lang==='en' ? '#fff' : '#B8C4BC';
  if(appLangFr && !appLangFr.dataset.wired){ appLangFr.dataset.wired='1'; appLangFr.addEventListener('click', ()=>{ setLang('fr'); render(); }); }
  if(appLangEn && !appLangEn.dataset.wired){ appLangEn.dataset.wired='1'; appLangEn.addEventListener('click', ()=>{ setLang('en'); render(); }); }
  const main = document.getElementById('main');
  if(view==='home') main.innerHTML = renderHome();
  else if(view==='new') main.innerHTML = renderForm();
  else if(view==='list') main.innerHTML = renderList();
  else if(view==='settings') main.innerHTML = renderSettings();
  else main.innerHTML = renderDash();
  attachHandlers();
}

// Crée le compte Firebase Auth sans déconnecter l'administrateur :
// on passe par une seconde instance de l'application Firebase.
async function createAuthAccount(username, password){
  const secondary = firebase.apps.find(a=>a.name==='gestion-comptes') || firebase.initializeApp(firebaseConfig, 'gestion-comptes');
  const cred = await secondary.auth().createUserWithEmailAndPassword(usernameToEmail(username), password);
  const uid = cred.user.uid;
  await secondary.auth().signOut();
  return uid;
}
