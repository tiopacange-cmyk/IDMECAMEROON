function wireSettings(){
  document.querySelectorAll('button[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ settingsTab = btn.dataset.tab; userDraft = null; render(); });
  });
  const addUserBtn = document.getElementById('user-add-btn');
  if(addUserBtn) addUserBtn.addEventListener('click', ()=>{ userDraft = { uid:null, nom:'', username:'', role:'Agent' }; render(); });
  document.querySelectorAll('.legacy-recreate-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const u = legacyUsers.find(x=>x.username===btn.dataset.username);
      if(u) userDraft = { uid:null, nom:u.nom, username:u.username, role: ROLES.includes(u.role) ? u.role : 'Agent' };
      render();
    });
  });
  document.querySelectorAll('.user-edit-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ const u = users.find(x=>x.uid===btn.dataset.uid); if(u) userDraft = { ...u }; render(); });
  });
  document.querySelectorAll('.user-toggle-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const u = users.find(x=>x.uid===btn.dataset.uid);
      if(!u) return;
      if(isAdminOrAbove(u.role) && currentUser.role!=='Super Admin'){ alert('Seul un Super Admin peut modifier ce compte.'); return; }
      const activate = u.active === false;
      if(!confirm(activate ? `Réactiver le compte de ${u.nom} ?` : `Désactiver le compte de ${u.nom} ? Il ne pourra plus se connecter.`)) return;
      try{
        await db.collection('users').doc(u.uid).update({ active: activate });
        addLog(activate ? 'Utilisateur réactivé' : 'Utilisateur désactivé', u.nom);
        await loadUsers();
        render();
      }catch(e){ alert("Modification refusée : " + e.message); }
    });
  });
  const saveUserBtn = document.getElementById('user-save-btn');
  if(saveUserBtn) saveUserBtn.addEventListener('click', async ()=>{
    const nom = document.getElementById('user-nom').value.trim();
    const username = document.getElementById('user-username').value.trim().toLowerCase();
    const role = document.getElementById('user-role').value;
    const editing = userDraft.uid ? users.find(u=>u.uid===userDraft.uid) : null;
    if(!nom){ alert('Le nom complet est requis.'); return; }
    if(isAdminOrAbove(role) && currentUser.role!=='Super Admin'){ alert('Seul un Super Admin peut attribuer le rôle Admin ou Super Admin.'); return; }
    if(editing && isAdminOrAbove(editing.role) && currentUser.role!=='Super Admin'){ alert('Seul un Super Admin peut modifier ce compte.'); return; }
    saveUserBtn.disabled = true;
    try{
      if(editing){
        if(editing.uid===currentUser.uid && role!==editing.role){ alert('Vous ne pouvez pas changer votre propre rôle.'); return; }
        await db.collection('users').doc(editing.uid).update({ nom, role });
        addLog('Utilisateur modifié', `${nom} (${role})`);
      } else {
        const password = document.getElementById('user-password').value;
        if(!USERNAME_RE.test(username)){ alert("Identifiant invalide : 3 à 32 caractères, lettres minuscules, chiffres, point ou tiret."); return; }
        if(password.length < MIN_PASSWORD_LENGTH){ alert(`Le mot de passe provisoire doit contenir au moins ${MIN_PASSWORD_LENGTH} caractères.`); return; }
        let uid;
        try{ uid = await createAuthAccount(username, password); }
        catch(e){
          alert(e.code==='auth/email-already-in-use' ? 'Cet identifiant est déjà utilisé.' : 'Le compte n\'a pas pu être créé : ' + e.message);
          return;
        }
        await db.collection('users').doc(uid).set({ username, nom, role, active:true, mustChangePassword:true, createdAt:new Date().toISOString(), createdBy: currentUser.nom });
        addLog('Utilisateur créé', `${nom} (${role})`);
        if(legacyUsers.some(u=>u.username===username)){
          legacyUsers = legacyUsers.filter(u=>u.username!==username);
          await saveConfig();
        }
      }
      userDraft = null;
      await loadUsers();
      render();
    }catch(e){
      alert('Enregistrement refusé : ' + e.message);
    }finally{
      saveUserBtn.disabled = false;
    }
  });
  const cancelUserBtn = document.getElementById('user-cancel-btn');
  if(cancelUserBtn) cancelUserBtn.addEventListener('click', ()=>{ userDraft = null; render(); });

  const saveSmsBtn = document.getElementById('sms-save-btn');
  if(saveSmsBtn) saveSmsBtn.addEventListener('click', async ()=>{
    appSettings.sms.apiKey = document.getElementById('sms-apikey').value;
    appSettings.sms.expediteur = document.getElementById('sms-expediteur').value;
    appSettings.sms.modeleCreation = document.getElementById('sms-modele-creation').value;
    appSettings.sms.modeleCloture = document.getElementById('sms-modele-cloture').value;
    await saveConfig();
    addLog('Paramètres SMS modifiés', '');
    alert('Paramètres SMS enregistrés.');
  });

  const saveAdminBtn = document.getElementById('admin-save-btn');
  if(saveAdminBtn) saveAdminBtn.addEventListener('click', async ()=>{
    appSettings.admin.nom = document.getElementById('admin-nom').value;
    appSettings.admin.adresse = document.getElementById('admin-adresse').value;
    appSettings.admin.telephone = document.getElementById('admin-telephone').value;
    appSettings.admin.email = document.getElementById('admin-email').value;
    appSettings.admin.recepisse = document.getElementById('admin-recepisse').value;
    appSettings.admin.compteBancaire = document.getElementById('admin-compte').value;
    appSettings.admin.montantMinimum = parseFloat(document.getElementById('admin-montant-min').value) || 0;
    await saveConfig();
    addLog('Coordonnées organisation modifiées', '');
    alert('Coordonnées enregistrées.');
  });

  document.querySelectorAll('.list-add-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const listKey = btn.dataset.list;
      const input = document.getElementById(`new-${listKey}-item`);
      const val = input.value.trim();
      if(!val) return;
      if(listKey==='problems') PROBLEMS.push(val);
      if(listKey==='pieces') PIECES_STANDARD.push(val);
      if(listKey==='destinations') DESTINATIONS.push(val);
      if(listKey==='probleme-piece'){
        const sel = settingsProblemeSelected || PROBLEMS[0];
        if(!PIECES_PAR_PROBLEME[sel]) PIECES_PAR_PROBLEME[sel] = [];
        PIECES_PAR_PROBLEME[sel].push(val);
      }
      await saveConfig();
      render();
    });
  });
  document.querySelectorAll('.list-remove-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const listKey = btn.dataset.list; const idx = +btn.dataset.index;
      if(listKey==='problems') PROBLEMS.splice(idx,1);
      if(listKey==='pieces') PIECES_STANDARD.splice(idx,1);
      if(listKey==='destinations') DESTINATIONS.splice(idx,1);
      if(listKey==='probleme-piece'){
        const sel = settingsProblemeSelected || PROBLEMS[0];
        if(PIECES_PAR_PROBLEME[sel]) PIECES_PAR_PROBLEME[sel].splice(idx,1);
      }
      await saveConfig();
      render();
    });
  });
  const problemeSelectList = document.getElementById('probleme-select-list');
  if(problemeSelectList) problemeSelectList.addEventListener('change', ()=>{
    settingsProblemeSelected = problemeSelectList.value;
    render();
  });

  const exportBtn = document.getElementById('export-btn');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify({ dossiers, PROBLEMS, PIECES_STANDARD, DESTINATIONS, appSettings, PIECES_PAR_PROBLEME }, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `id-me-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    addLog('Export effectué', `${dossiers.length} dossiers`);
  });
  const importBtn = document.getElementById('import-btn');
  if(importBtn) importBtn.addEventListener('click', ()=>{
    const fileInput = document.getElementById('import-file');
    const file = fileInput.files[0];
    if(!file){ alert('Sélectionnez un fichier à importer.'); return; }
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const data = JSON.parse(e.target.result);
        if(!confirm(`Remplacer les ${dossiers.length} dossiers actuels par ${(data.dossiers||[]).length} dossiers importés ? Cette action est irréversible.`)) return;
        if(data.dossiers) dossiers = data.dossiers;
        // Les comptes ne sont pas importés : ils sont gérés par Firebase Authentication.
        if(data.PROBLEMS) PROBLEMS = data.PROBLEMS;
        if(data.PIECES_STANDARD) PIECES_STANDARD = data.PIECES_STANDARD;
        if(data.DESTINATIONS) DESTINATIONS = data.DESTINATIONS;
        if(data.appSettings) appSettings = data.appSettings;
        if(data.PIECES_PAR_PROBLEME) PIECES_PAR_PROBLEME = data.PIECES_PAR_PROBLEME;
        await saveData();
        await saveConfig();
        addLog('Import effectué', `${dossiers.length} dossiers`);
        alert('Import réussi.');
        render();
      }catch(err){ alert('Fichier invalide : ' + err.message); }
    };
    reader.readAsText(file);
  });
}

function renderList(){
  const term = searchTerm.trim().toLowerCase();
  const communes = [...new Set(dossiers.map(d=>d.commune).filter(Boolean))].sort();
  const regions = [...new Set(dossiers.map(d=>d.region).filter(Boolean))].sort();
  const departements = [...new Set(dossiers.map(d=>d.departement).filter(Boolean))].sort();
  const villages = [...new Set(dossiers.map(d=>d.village).filter(Boolean))].sort();
  const centres = [...new Set(dossiers.map(d=>d.centre).filter(Boolean))].sort();
  const agents = [...new Set(dossiers.map(d=>d.agent).filter(Boolean))].sort();

  const pieceComplete = d => (d.pieces||[]).length>0 && d.pieces.every(p=>p.statut==='Fournie');

  let filtered = dossiers.filter(d=>{
    if(term && !([d.id,d.nom,d.prenom,d.tel,d.commune,d.village,d.region,d.departement,d.dossier_judiciaire,d.reference_acte].some(v=>(v||'').toLowerCase().includes(term)))) return false;
    if(filterEtape){
      const p = progressInfo(d);
      if(filterEtape==='closed'){ if(!p.closed) return false; }
      else if(String(p.currentIndex)!==filterEtape || p.closed) return false;
    }
    if(filterCommune && d.commune!==filterCommune) return false;
    if(filterRegion && d.region!==filterRegion) return false;
    if(filterDepartement && d.departement!==filterDepartement) return false;
    if(filterVillage && d.village!==filterVillage) return false;
    if(filterCentre && d.centre!==filterCentre) return false;
    if(filterAgent && d.agent!==filterAgent) return false;
    if(filterDestination){
      if(filterDestination==='__envoyes__' && !(d.envois||[]).length) return false;
      if(filterDestination!=='__envoyes__' && !(d.envois||[]).some(e=>e.destination===filterDestination)) return false;
    }
    if(filterPaiement==='Payé' && !d.paiement_montant) return false;
    if(filterPaiement==='Non payé' && d.paiement_montant) return false;
    if(filterSituation && d.situation_dossier!==filterSituation) return false;
    if(filterPieces==='Complet' && !pieceComplete(d)) return false;
    if(filterPieces==='Incomplet' && pieceComplete(d)) return false;
    if(filterDateDebut && (!d.date_enrolement || d.date_enrolement<filterDateDebut)) return false;
    if(filterDateFin && (!d.date_enrolement || d.date_enrolement>filterDateFin)) return false;
    return true;
  });

  const [sortField, sortDir] = sortValue.split('_');
  filtered = filtered.sort((a,b)=>{
    let av, bv;
    if(sortField==='nom'){ av=(a.nom||'').toLowerCase(); bv=(b.nom||'').toLowerCase(); }
    else if(sortField==='etape'){ av=progressInfo(a).doneCount; bv=progressInfo(b).doneCount; }
    else { av=a.date_enrolement||''; bv=b.date_enrolement||''; }
    const cmp = av<bv?-1:av>bv?1:0;
    return sortDir==='asc' ? cmp : -cmp;
  });

    <div class="grid" style="margin-bottom:18px;">
      <div class="field"><label>Agent</label>${searchableFilterField('filter-agent', agents, filterAgent, 'Tous agents')}</div>

        <select id="filter-destination">
          <option value=""${!filterDestination?' selected':''}>Toutes destinations</option>

          <td>${d.date_enrolement||'—'}</td>

      }).join('')}

}

function renderDash(){
  const total = dossiers.length;
  const complets = dossiers.filter(d=> d.nom && d.prenom && d.commune && d.agent && d.probleme).length;
  const incomplets = total - complets;
  const parCommune = {}; const parRegion = {}; const parAgent = {}; const parEtape = {}; const parVillage = {};
  dossiers.forEach(d=>{
    const c = d.commune || 'Non renseignée'; parCommune[c]=(parCommune[c]||0)+1;
    const r = d.region || 'Non renseignée'; parRegion[r]=(parRegion[r]||0)+1;
    const a = d.agent || 'Non renseigné'; parAgent[a]=(parAgent[a]||0)+1;
    const v = d.village || 'Non renseigné'; parVillage[v]=(parVillage[v]||0)+1;
    const p = progressInfo(d);
    const e = p.closed ? `Clôturé` : `${STEP_LABELS[p.currentIndex]}`;
    parEtape[e]=(parEtape[e]||0)+1;
  });
  const dossiersAvecIncident = dossiers.filter(d=>(d.incidents||[]).length>0).length;
  const jugementsRendus = dossiers.filter(d=>d.type_cas==='Cas TPI' && (d.cycle_stage||0)>=3).length;
  const orienteMairie = dossiers.filter(d=>(d.envois||[]).some(e=>e.destination==='Mairie')).length;
  const orienteTPI = dossiers.filter(d=>(d.envois||[]).some(e=>e.destination==='TPI')).length;
  const suspendus = dossiers.filter(d=>d.situation_dossier==='Suspendu').length;
  const paiementsEffectues = dossiers.filter(d=>d.paiement_date || d.paiement_montant).length;
  const nonPayes = total - paiementsEffectues;
  const exoneres = dossiers.filter(d=>d.paiement_exonere).length;
  const totalCollecte = dossiers.reduce((sum,d)=> sum + (parseFloat(d.paiement_montant)||0), 0);
  const envoyes = dossiers.filter(d=> (d.envois||[]).length > 0).length;
  const clotures = dossiers.filter(d=>d.decharge_remise==='Oui').length;
  const enCours = total - clotures;

  const delais = dossiers
    .filter(d=> d.date_enrolement && (d.envois||[]).length)
    .map(d=>{
      const premierEnvoi = d.envois.map(e=>e.date_envoi).filter(Boolean).sort()[0];
      return premierEnvoi ? (new Date(premierEnvoi) - new Date(d.date_enrolement)) / 86400000 : null;
    })
    .filter(n=> n!==null && !isNaN(n) && n>=0);
  const delaiMoyen = delais.length ? Math.round(delais.reduce((a,b)=>a+b,0)/delais.length) : null;

  const barSection = (title, obj) => {
    const max = Math.max(1, ...Object.values(obj));
    const entries = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,8);
    return `<div class="section-block"><div class="subhead">${title}</div>
      ${entries.length ? entries.map(([k,v])=>`
        <div class="bar-row"><span class="lab">${k}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(v/max)*100}%"></div></div>
          <span class="val">${v}</span>
        </div>`).join('') : `<p style="color:var(--ink-soft);font-size:13px;">Aucune donnée.</p>`}
    </div>`;
  };

  return `
  <div class="page-head">
    <h1>${t('page_dash')}</h1>
    <p>Indicateurs calculés à partir des dossiers enregistrés</p>
  </div>

  <div class="dash-group-title">${STEP_ICONS[0]} Progression des dossiers</div>
  <div class="stat-grid">
    <div class="stat"><div class="n">${total}</div><div class="l">Dossiers enrôlés</div></div>
    <div class="stat accent-green"><div class="n">${clotures}</div><div class="l">Clôturés</div></div>
    <div class="stat accent-gold"><div class="n">${enCours}</div><div class="l">En cours</div></div>
    <div class="stat"><div class="n">${complets}</div><div class="l">Dossiers complets</div></div>
    <div class="stat"><div class="n">${incomplets}</div><div class="l">Dossiers incomplets</div></div>
  </div>

  <div class="dash-group-title">${ico('wallet')} Financier</div>
  <div class="stat-grid">
    <div class="stat accent-green"><div class="n">${paiementsEffectues}</div><div class="l">Paiements reçus</div></div>
    <div class="stat"><div class="n">${totalCollecte.toLocaleString('fr-FR')}</div><div class="l">FCFA collectés</div></div>
    <div class="stat accent-red"><div class="n">${nonPayes}</div><div class="l">Non payés</div></div>
    <div class="stat accent-gold"><div class="n">${exoneres}</div><div class="l">Paiements exonérés</div></div>
  </div>

  <div class="dash-group-title">${ico('send')} Traitement & Envois</div>
  <div class="stat-grid">
    <div class="stat"><div class="n">${envoyes}</div><div class="l">Dossiers envoyés</div></div>
    <div class="stat"><div class="n">${orienteMairie}</div><div class="l">Orientés Mairie</div></div>
    <div class="stat"><div class="n">${orienteTPI}</div><div class="l">Orientés TPI</div></div>
    <div class="stat accent-green"><div class="n">${jugementsRendus}</div><div class="l">Jugements rendus</div></div>
    <div class="stat accent-red"><div class="n">${dossiersAvecIncident}</div><div class="l">Dossiers rejetés/bloqués</div></div>
    <div class="stat accent-gold"><div class="n">${suspendus}</div><div class="l">Suspendus</div></div>
    <div class="stat"><div class="n">${delaiMoyen!==null ? delaiMoyen+'j' : '—'}</div><div class="l">Délai moyen jusqu'à l'envoi</div></div>
  </div>

  <div class="dash-group-title">${ico('pin')} Répartition géographique</div>
  ${barSection('Dossiers par étape', parEtape)}
  ${barSection('Dossiers par région', parRegion)}
  ${barSection('Dossiers par commune', parCommune)}
  ${barSection('Dossiers par village', parVillage)}
  ${barSection('Dossiers par agent', parAgent)}
  `;
}

function openDetail(d){
  editDraft = { ...d };
  editStep = 0;
  deleteArmedId = null;
  openPiecePicker = null; newEnvoiPieces = []; newEnvoiDest = DESTINATIONS[0]; newEnvoiMotif = ''; newEnvoiDate = new Date().toISOString().slice(0,10);
  renderDetail(d);
}

function renderDetail(d){
  const armed = deleteArmedId === d.id;
  const journal = (d.journal || []).slice().reverse();
  editLockLevel = computeLockLevel(d);
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-back" id="modal-back">
      <div class="modal">
        <h2>${d.nom||''} ${d.prenom||''}</h2>
        <p style="color:var(--ink-soft); font-size:12.5px; margin:2px 0 16px;">${d.id}</p>
        ${editLockLevel==='full' ? `<div class="alert alert-warn">${ico('lock')} Dossier clôturé — modification réservée à l'administrateur.</div>` : ''}
        <form id="edit-form" data-mode="edit" data-id="${d.id}">
          ${progressBadgeHtml(editDraft)}
          ${wizardHtml(editDraft, editStep, 'Enregistrer les modifications')}
        </form>

        <div class="modal-actions" style="justify-content:space-between; margin-top:0;">
          ${currentUser && currentUser.role !== 'Agent' ? `
          <button type="button" class="btn" id="modal-delete" style="background:${armed?'var(--red-solid)':'transparent'}; color:${armed?'#fff':'var(--red)'}; border:1px solid var(--red);">
            ${armed ? 'Confirmer la suppression' : 'Supprimer le dossier'}
          </button>` : '<span></span>'}
          <button type="button" class="btn btn-ghost" id="modal-close">Fermer</button>
        </div>

        <div class="section-block" style="margin-top:24px;">
          <h3>Journal de suivi</h3>
          <div id="journal-list">
            ${journal.length ? journal.map(j=>`<div class="detail-row"><span class="k">${j.date}</span><span class="v">${j.note}</span></div>`).join('') : "<p style=\"color:var(--ink-soft); font-size:13px;\">Aucune entrée pour l'instant — chaque nouveau document, rapport ou mise à jour peut être noté ici.</p>"}
          </div>
          <div class="field" style="margin-top:12px;">
            <label>Ajouter une entrée</label>
            <input id="journal-note" placeholder="Ex : rapport TPI reçu, pièce transmise à la mairie…">
          </div>
          <button type="button" class="btn btn-ghost" id="journal-add" style="margin-top:10px;">Ajouter au journal</button>
        </div>
      </div>
    </div>`;

  const form = document.getElementById('edit-form');
  wireResponsableToggle(form);
  wireGeographyCascade(form);
  wireProblemeDisplay(form, editDraft, ()=>renderDetail(d));
  wirePaiementModeDisplay(form, editDraft, ()=>renderDetail(d));
  wireMotifNonDeclaration(form, editDraft, ()=>renderDetail(d));
  wireMotifPaiement(form, editDraft, ()=>renderDetail(d));
  wireExoneration(form, editDraft, ()=>renderDetail(d));
  wireCycle(form, editDraft, ()=>renderDetail(d));
  wireDocUploads(form, editDraft, ()=>renderDetail(d));
  wirePieceFileUploads(form, editDraft, ()=>renderDetail(d));
  document.getElementById('modal-back').addEventListener('click', e=>{ if(e.target.id==='modal-back') closeModal(); });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  const delBtn = document.getElementById('modal-delete');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    if(deleteArmedId === d.id){
      dossiers = dossiers.filter(x=>x.id!==d.id);
      await saveData();
      addLog('Dossier supprimé', `${d.id} — ${d.nom||''} ${d.prenom||''}`);
      deleteArmedId = null;
      closeModal();
      render();
    } else {
      deleteArmedId = d.id;
      renderDetail(d);
    }
  });
  const prev = document.getElementById('wiz-prev');
  if(prev) prev.addEventListener('click', ()=>{ captureStep(form, editDraft); editStep = Math.max(0, editStep-1); renderDetail(d); });
  const next = document.getElementById('wiz-next');
  if(next) next.addEventListener('click', ()=>{
    captureStep(form, editDraft);
    if(editStep===1 && !paymentSatisfied(editDraft)){ renderDetail(d); return; }
    editStep = Math.min(STEP_SECTIONS.length-1, editStep+1); renderDetail(d);
  });
  const savePayment = document.getElementById('wiz-save-payment');
  if(savePayment) savePayment.addEventListener('click', async ()=>{
    captureStep(form, editDraft);
    if(!paymentSatisfied(editDraft)){ renderDetail(d); return; }
    Object.assign(d, editDraft);
    await saveData();
    addLog('Paiement enregistré', `${d.id} — ${d.nom||''} ${d.prenom||''}`);
    showConfirmModal(t('toast_paid'));
    editStep = Math.min(STEP_SECTIONS.length-1, editStep+1);
    renderDetail(d);
  });
  const saveOnly = document.getElementById('wiz-save-only');
  if(saveOnly) saveOnly.addEventListener('click', async ()=>{
    captureStep(form, editDraft);
    Object.assign(d, editDraft);
    await saveData();
    addLog('Dossier enregistré (étape)', `${d.id} — ${d.nom||''} ${d.prenom||''}`);
    showToast(t('toast_saved'));
    renderDetail(d);
  });
  form.querySelectorAll('.wdot').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      captureStep(form, editDraft);
      let target = +btn.dataset.step;
      if(target>1 && !paymentSatisfied(editDraft)) target = 1;
      editStep = target; renderDetail(d);
    });
  });
  const printA4Btn = document.getElementById('print-receipt-a4-btn');
  if(printA4Btn) printA4Btn.addEventListener('click', ()=>{ captureStep(form, editDraft); printReceiptA4(editDraft); });
  const printTicketBtn = document.getElementById('print-receipt-ticket-btn');
  if(printTicketBtn) printTicketBtn.addEventListener('click', ()=>{ captureStep(form, editDraft); printReceiptTicket(editDraft); });
  const printFormBtn = document.getElementById('print-formulaire-btn');
  if(printFormBtn) printFormBtn.addEventListener('click', ()=>{ captureStep(form, editDraft); printFormulaire(editDraft); });
  const printDechargeBtn = document.getElementById('print-decharge-btn');
  if(printDechargeBtn) printDechargeBtn.addEventListener('click', ()=>{ captureStep(form, editDraft); printDecharge(editDraft); });
  if(editStep===3) wireStep4(form, editDraft, ()=>renderDetail(d));
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    captureStep(form, editDraft);
    Object.assign(d, editDraft);
    await saveData();
    addLog('Dossier modifié', `${d.id} — ${d.nom||''} ${d.prenom||''}`);
    closeModal();
    render();
  });
  document.getElementById('journal-add').addEventListener('click', async ()=>{
    const input = document.getElementById('journal-note');
    const note = input.value.trim();
    if(!note) return;
    d.journal = d.journal || [];
    d.journal.push({ date: new Date().toISOString().slice(0,10), note });
    await saveData();
    renderDetail(d);
  });
}
function closeModal(){ deleteArmedId = null; document.getElementById('modal-root').innerHTML = ''; }

function attachHandlers(){
  document.querySelectorAll('nav button').forEach(b=> b.onclick = ()=> setView(b.dataset.view));

  document.querySelectorAll('.module-select-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      formDraft.module = btn.dataset.module;
      moduleStep = 0;
      render();
    });
  });

  const moduleForm = document.getElementById('module-form');
  if(moduleForm){
    wireGeographyCascade(moduleForm);
    const modPrev = document.getElementById('module-prev');
    if(modPrev) modPrev.addEventListener('click', ()=>{ captureStep(moduleForm, formDraft); moduleStep = Math.max(0, moduleStep-1); render(); });
    const modNext = document.getElementById('module-next');
    if(modNext) modNext.addEventListener('click', ()=>{ captureStep(moduleForm, formDraft); moduleStep = Math.min(MODULE_STEP_LABELS.length-1, moduleStep+1); render(); });
    const docFinalInput = moduleForm.querySelector('.doc-file-input[data-key="doc_final"]');
    if(docFinalInput) docFinalInput.addEventListener('change', async ()=>{
      const file = docFinalInput.files[0];
      if(!file) return;
      const dataUrl = await compressImageFile(file, 1000, 0.6);
      captureStep(moduleForm, formDraft);
      formDraft.doc_final = { fileData: dataUrl, fileName: file.name };
      render();
    });
    const docFinalRemove = moduleForm.querySelector('.doc-file-remove[data-key="doc_final"]');
    if(docFinalRemove) docFinalRemove.addEventListener('click', ()=>{
      captureStep(moduleForm, formDraft);
      formDraft.doc_final = null;
      render();
    });
    moduleForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      captureStep(moduleForm, formDraft);
      if(!formDraft.nom || !formDraft.prenom){
        alert("Le nom et le prénom sont requis.");
        moduleStep = 0; render();
        return;
      }
      dossiers.push({ ...formDraft, decharge_remise: 'Oui' });
      await saveData();
      addLog('Dossier créé', `${formDraft.id} — ${formDraft.module} — ${formDraft.nom||''} ${formDraft.prenom||''}`);
      showToast('Dossier clôturé avec succès');
      formDraft = { id: nextId() };
      moduleStep = 0;
      setView('list');
    });
  }

  const form = document.getElementById('dossier-form');
  if(form){
    wireResponsableToggle(form);
    wireGeographyCascade(form);
    wireProblemeDisplay(form, formDraft, render);
    wirePaiementModeDisplay(form, formDraft, render);
    wireMotifNonDeclaration(form, formDraft, render);
    wireMotifPaiement(form, formDraft, render);
    wireExoneration(form, formDraft, render);
    wireCycle(form, formDraft, render);
    wireDocUploads(form, formDraft, render);
    wirePieceFileUploads(form, formDraft, render);
    const prev = document.getElementById('wiz-prev');
    if(prev) prev.addEventListener('click', ()=>{ captureStep(form, formDraft); formStep = Math.max(0, formStep-1); render(); });
    const next = document.getElementById('wiz-next');
    if(next) next.addEventListener('click', ()=>{
      captureStep(form, formDraft);
      if(formStep===1 && !paymentSatisfied(formDraft)){ render(); return; }
      formStep = Math.min(STEP_SECTIONS.length-1, formStep+1); render();
    });
    const saveFormProgress = async ()=>{
      captureStep(form, formDraft);
      if(!formDraft.nom || !formDraft.prenom){
        alert("Le nom et le prénom sont requis (étape 1).");
        formStep = 0; render();
        return false;
      }
      if(!pendingDuplicate){
        const dups = findSimilar(formDraft.nom, formDraft.prenom, formDraft.dob, formDraft.id);
        if(dups.length){ pendingDuplicate = dups; formStep = 0; render(); return false; }
      }
      const existing = dossiers.find(x=>x.id===formDraft.id);
      if(existing) Object.assign(existing, formDraft);
      else dossiers.push({ ...formDraft });
      await saveData();
      addLog('Dossier enregistré (étape)', `${formDraft.id} — ${formDraft.nom||''} ${formDraft.prenom||''}`);
      pendingDuplicate = null;
      return true;
    };
    const savePayment = document.getElementById('wiz-save-payment');
    if(savePayment) savePayment.addEventListener('click', async ()=>{
      captureStep(form, formDraft);
      if(!paymentSatisfied(formDraft)){ render(); return; }
      const ok = await saveFormProgress();
      if(!ok) return;
      showConfirmModal(t('toast_paid'));
      formStep = Math.min(STEP_SECTIONS.length-1, formStep+1);
      render();
    });
    const saveOnly = document.getElementById('wiz-save-only');
    if(saveOnly) saveOnly.addEventListener('click', async ()=>{
      const ok = await saveFormProgress();
      if(!ok) return;
      showToast(t('toast_saved'));
      render();
    });
    form.querySelectorAll('.wdot').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        captureStep(form, formDraft);
        let target = +btn.dataset.step;
        if(target>1 && !paymentSatisfied(formDraft)) target = 1;
        formStep = target; render();
      });
    });
    const printA4Btn = document.getElementById('print-receipt-a4-btn');
    if(printA4Btn) printA4Btn.addEventListener('click', ()=>{ captureStep(form, formDraft); printReceiptA4(formDraft); });
    const printTicketBtn = document.getElementById('print-receipt-ticket-btn');
    if(printTicketBtn) printTicketBtn.addEventListener('click', ()=>{ captureStep(form, formDraft); printReceiptTicket(formDraft); });
    const printFormBtn = document.getElementById('print-formulaire-btn');
    if(printFormBtn) printFormBtn.addEventListener('click', ()=>{ captureStep(form, formDraft); printFormulaire(formDraft); });
    const printDechargeBtn = document.getElementById('print-decharge-btn');
    if(printDechargeBtn) printDechargeBtn.addEventListener('click', ()=>{ captureStep(form, formDraft); printDecharge(formDraft); });
    if(formStep===3) wireStep4(form, formDraft, render);
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      captureStep(form, formDraft);
      if(!formDraft.nom || !formDraft.prenom){
        alert("Le nom et le prénom sont requis (étape 1).");
        formStep = 0; render();
        return;
      }
      if(!pendingDuplicate){
        const dups = findSimilar(formDraft.nom, formDraft.prenom, formDraft.dob, formDraft.id);
        if(dups.length){ pendingDuplicate = dups; formStep = 0; render(); return; }
      }
      const record = { ...formDraft, id: formDraft.id || nextId() };
      dossiers.push(record);
      await saveData();
      addLog('Dossier créé', `${record.id} — ${record.nom||''} ${record.prenom||''}`);
      pendingDuplicate = null;
      formDraft = { id: nextId() };
      formStep = 0;
      setView('list');
    });
  }

  const search = document.getElementById('search-input');
  if(search){
    search.addEventListener('input', e=>{ searchTerm = e.target.value; render(); document.getElementById('search-input').focus(); document.getElementById('search-input').setSelectionRange(searchTerm.length, searchTerm.length); });
  }
  const fEtape = document.getElementById('filter-etape');
  if(fEtape) fEtape.addEventListener('change', e=>{ filterEtape = e.target.value; render(); });
  const fDestination = document.getElementById('filter-destination');
  if(fDestination) fDestination.addEventListener('change', e=>{ filterDestination = e.target.value; render(); });
  const fSort = document.getElementById('sort-select');
  if(fSort) fSort.addEventListener('change', e=>{ sortValue = e.target.value; render(); });
  const toggleFilters = document.getElementById('toggle-filters');
  if(toggleFilters) toggleFilters.addEventListener('click', ()=>{ filtersExpanded = !filtersExpanded; render(); });
  const myDossiersBtn = document.getElementById('my-dossiers-btn');
  if(myDossiersBtn) myDossiersBtn.addEventListener('click', ()=>{ filterAgent = currentUser.nom; filtersExpanded = true; render(); });
  const fRegion = document.getElementById('filter-region');
  if(fRegion) fRegion.addEventListener('change', e=>{ filterRegion = e.target.value; render(); });
  const fDepartement = document.getElementById('filter-departement');
  if(fDepartement) fDepartement.addEventListener('change', e=>{ filterDepartement = e.target.value; render(); });
  const fCommune = document.getElementById('filter-commune');
  if(fCommune) fCommune.addEventListener('change', e=>{ filterCommune = e.target.value; render(); });
  const fVillage = document.getElementById('filter-village');
  if(fVillage) fVillage.addEventListener('change', e=>{ filterVillage = e.target.value; render(); });
  const fCentre = document.getElementById('filter-centre');
  if(fCentre) fCentre.addEventListener('change', e=>{ filterCentre = e.target.value; render(); });
  const fAgent = document.getElementById('filter-agent');
  if(fAgent) fAgent.addEventListener('change', e=>{ filterAgent = e.target.value; render(); });
  const fPaiement = document.getElementById('filter-paiement');
  if(fPaiement) fPaiement.addEventListener('change', e=>{ filterPaiement = e.target.value; render(); });
  const fSituation = document.getElementById('filter-situation');
  if(fSituation) fSituation.addEventListener('change', e=>{ filterSituation = e.target.value; render(); });
  const fPieces = document.getElementById('filter-pieces');
  if(fPieces) fPieces.addEventListener('change', e=>{ filterPieces = e.target.value; render(); });
  const fDateDebut = document.getElementById('filter-date-debut');
  if(fDateDebut) fDateDebut.addEventListener('change', e=>{ filterDateDebut = e.target.value; render(); });
  const fDateFin = document.getElementById('filter-date-fin');
  if(fDateFin) fDateFin.addEventListener('change', e=>{ filterDateFin = e.target.value; render(); });
  const clearFilters = document.getElementById('clear-filters');
  if(clearFilters) clearFilters.addEventListener('click', ()=>{
    filterRegion=''; filterDepartement=''; filterVillage=''; filterCentre=''; filterAgent=''; filterPaiement=''; filterSituation=''; filterPieces=''; filterDateDebut=''; filterDateFin='';
    render();
  });

  document.querySelectorAll('tr[data-id]').forEach(tr=>{
    tr.onclick = ()=>{
      const d = dossiers.find(x=>x.id===tr.dataset.id);
      if(d) openDetail(d);
    };
  });

  wireSettings();
  wireFilterGeographyCascade();
  const ctaNew = document.getElementById('home-cta-new');
  if(ctaNew) ctaNew.addEventListener('click', ()=> setView('new'));
  const ctaList = document.getElementById('home-cta-list');
  if(ctaList) ctaList.addEventListener('click', ()=> setView('list'));
}

document.getElementById('logout-btn').addEventListener('click', logout);
loadData();
</script>
<script>
/* Thème clair / sombre (design system IDME) — préférence mémorisée sur ce navigateur */
(function(){
  var KEY='idme-theme', root=document.documentElement;
  function apply(t){
    root.setAttribute('data-theme', t);
    var b=document.getElementById('theme-toggle');
    if(b){ b.setAttribute('aria-pressed', t==='dark' ? 'true' : 'false');
      var s=b.querySelector('span'); if(s) s.textContent = t==='dark' ? 'Mode clair' : 'Mode sombre'; }
  }
  var t='light'; try{ t = localStorage.getItem(KEY) || 'light'; }catch(e){}
  apply(t);
  document.addEventListener('click', function(e){
    if(!e.target.closest || !e.target.closest('#theme-toggle')) return;
    t = root.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
    apply(t); try{ localStorage.setItem(KEY, t); }catch(err){}
  });
})();
</script>
</body>
</html>
